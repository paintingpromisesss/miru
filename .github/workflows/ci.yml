name: CI
on:
  push:
    branches: ['fix/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: node web/check-ui.cjs
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/miru-arm64 ./cmd/miru
      - uses: actions/upload-artifact@v4
        with:
          name: miru-linux-arm64-test
          path: /tmp/miru-arm64
          if-no-files-found: error
