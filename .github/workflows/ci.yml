name: CI
on:
  push:
    branches: ['fix/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bundle local CSS
        run: |
          npx --yes --package=tailwindcss@3.4.17 tailwindcss -i web/tailwind.css -o /tmp/miru-tailwind.css --content web/index.html --minify
          node web/bundle-css.cjs /tmp/miru-tailwind.css
      - run: node web/check-ui.cjs
      - name: Browser smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/browser-smoke.cjs
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/miru-arm64 ./cmd/miru
      - uses: actions/upload-artifact@v4
        with:
          name: miru-linux-arm64-test
          path: /tmp/miru-arm64
          if-no-files-found: error
