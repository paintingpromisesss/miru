name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bundle local CSS
        run: |
          npx --yes --package=tailwindcss@3.4.17 tailwindcss -i web/tailwind.css -o /tmp/miru-tailwind.css --content web/index.html --minify
          node web/bundle-css.cjs /tmp/miru-tailwind.css
      - run: node web/check-ui.cjs
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/miru-arm64 ./cmd/miru
      - uses: actions/upload-artifact@v4
        with:
          name: miru-linux-arm64-test
          path: /tmp/miru-arm64
          if-no-files-found: error
