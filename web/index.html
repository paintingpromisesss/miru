<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miru — Mihomo Rule Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
      },
      colors: {
        zinc: {
          950: '#09090b',
          900: '#18181b',
          800: '#27272a',
          700: '#3f3f46',
          600: '#52525b',
          500: '#71717a',
          400: '#a1a1aa',
          300: '#d4d4d8',
          200: '#e4e4e7',
          100: '#f4f4f5',
          50: '#fafafa',
        }
      }
    }
  }
}
</script>
<style>
  * { border-color: #27272a; }
  body { background-color: #09090b; color: #fafafa; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .toast-slide { animation: toastSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes toastSlide {
    from { transform: translateY(-8px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #09090b; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-zinc-800 selection:text-zinc-50">

<header class="w-full border-b border-zinc-800 bg-zinc-950/90 backdrop-blur sticky top-0 z-30">
  <div class="w-full px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-md bg-zinc-100 text-zinc-950 flex items-center justify-center font-bold text-sm tracking-tighter shadow-sm">
        M
      </div>
      <span class="font-semibold text-sm tracking-tight text-zinc-100 mr-0.5">Miru</span>

      <div id="card-mihomo-status" class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs cursor-pointer hover:border-zinc-700 transition-all duration-300 ease-out select-none group shadow-sm" title="Click to ping Mihomo API">
        <span id="stat-mihomo-dot" class="w-2 h-2 rounded-full bg-zinc-500 animate-pulse flex-shrink-0 transition-colors duration-200"></span>
        <span id="stat-mihomo-status" class="text-xs font-medium text-zinc-300 transition-colors duration-200 whitespace-nowrap">Checking...</span>
        <span id="stat-mihomo-version" class="overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 text-[10px] font-mono rounded bg-zinc-800/90 text-zinc-300 border border-transparent leading-tight flex items-center justify-center"></span>
        <svg id="stat-mihomo-ping-icon" class="w-2.5 h-2.5 text-zinc-500 group-hover:text-zinc-300 transition-colors ml-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btn-toggle-quic" title="Toggle global UDP port 443 block for all traffic" class="h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 rounded-md transition-all flex items-center gap-2 shadow-sm">
        <span id="global-quic-indicator" class="w-2 h-2 rounded-full bg-zinc-600 transition-colors"></span>
        <span id="global-quic-text">Block All QUIC</span>
      </button>

      <button id="btn-custom-rule" class="h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Custom MRS
      </button>

      <button id="btn-reload-mihomo" class="h-8 px-3 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-semibold">
        <svg id="reload-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reload Core
      </button>
    </div>
  </div>
</header>

<div class="w-full px-6 py-6 flex-1 space-y-6">

  <div class="border-b border-zinc-800">
    <nav class="flex space-x-6 -mb-px" id="tabs">
      <button data-tab="catalog" class="tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 border-zinc-100 text-zinc-100 font-semibold">
        <span>Rules Catalog</span>
      </button>
      <button data-tab="active" class="tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700">
        <span>Active Directives</span>
        <span id="tab-count-active" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/50">0</span>
      </button>
      <button data-tab="local" class="tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700">
        <span>Config & Files</span>
        <span id="tab-count-files" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/50">0</span>
      </button>
    </nav>
  </div>

  <main id="tab-content" class="w-full"></main>
</div>

<footer class="border-t border-zinc-800/80 py-4 px-6 text-xs text-zinc-500 flex items-center justify-between">
  <span>Miru · Embedded Linux / OpenWrt Mihomo Controller</span>
  <a href="https://github.com/paintingpromisesss/miru" target="_blank" rel="noopener" class="hover:text-zinc-300 transition-colors">GitHub Repository</a>
</footer>

<div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 max-w-sm w-full pointer-events-none px-4"></div>
<div id="modal-container" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4"></div>

<script>
const API = {
  getLocal: () => fetch('/api/local').then(r => r.json()),
  getCatalog: (refresh = false) => fetch('/api/catalog' + (refresh ? '?action=refresh' : '')).then(r => r.json()),
  addRule: (data) => fetch('/api/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  editRule: (data) => fetch('/api/rules', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  deleteRule: (name, deleteFile = true) => fetch(`/api/rules?name=${encodeURIComponent(name)}&delete_file=${deleteFile}`, {
    method: 'DELETE'
  }),
  toggleGlobalQuic: (enabled) => fetch('/api/quic/global', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ enabled })
  }).then(r => r.json()),
  reloadMihomo: () => fetch('/api/reload', { method: 'POST' }).then(r => r.json()),
  getMihomoStatus: () => fetch('/api/mihomo/status').then(r => r.json()),
  previewRule: (name, url) => {
    let q = [];
    if (name) q.push(`name=${encodeURIComponent(name)}`);
    if (url) q.push(`url=${encodeURIComponent(url)}`);
    return fetch(`/api/rules/preview?${q.join('&')}`).then(async r => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    });
  }
};

let state = {
  currentTab: 'catalog',
  local: null,
  catalog: [],
  catalogMap: {},
  catalogLoading: false,
  catalogSyncError: null,
  catalogLoadedAt: '',
  catalogWarning: '',
  searchQuery: '',
  categoryFilter: 'all',
  selectedCategories: new Set(),
  selectedBehaviors: new Set(),
  page: 1,
  pageSize: 50,
};

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const border = {
    success: 'border-emerald-800/60 bg-zinc-900 text-zinc-200',
    error: 'border-red-800/60 bg-zinc-900 text-zinc-200',
    info: 'border-zinc-800 bg-zinc-900 text-zinc-200',
    warning: 'border-amber-800/60 bg-zinc-900 text-zinc-200',
  }[type] || 'border-zinc-800 bg-zinc-900 text-zinc-200';

  const dot = {
    success: 'bg-emerald-500',
    error: 'bg-red-500',
    info: 'bg-zinc-400',
    warning: 'bg-amber-500',
  }[type] || 'bg-zinc-400';

  toast.className = `toast-slide border rounded-md p-3 text-xs shadow-lg flex items-center gap-2.5 pointer-events-auto w-full ${border}`;
  toast.innerHTML = `
    <span class="w-2 h-2 rounded-full ${dot} flex-shrink-0"></span>
    <div class="flex-1">${escapeHtml(message)}</div>
    <button class="text-zinc-500 hover:text-zinc-300 text-sm leading-none">&times;</button>
  `;
  toast.querySelector('button').onclick = () => toast.remove();
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3500);
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function setTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 ${
      active
        ? 'border-zinc-100 text-zinc-100 font-semibold'
        : 'border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700'
    }`;
  });
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

async function fetchLocal() {
  try {
    const data = await API.getLocal();
    state.local = data;
    updateStats();
  } catch (err) {
    showToast('Failed to load local config: ' + err.message, 'error');
  }
}

function renderCatalogSyncButton() {
  const isLoading = state.catalogLoading;
  const isError = !!state.catalogSyncError;

  let btnClasses = 'h-8 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out ';
  let labelClasses = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 ';
  let dotClasses = 'w-1.5 h-1.5 rounded-full flex-shrink-0 ';
  let iconClasses = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 ';
  let labelText = '';
  let title = 'Refresh catalog';

  if (isError) {
    btnClasses += 'px-2.5 border-red-500/40 bg-red-500/10 text-red-300 hover:bg-red-500/20 hover:border-red-500/60 cursor-pointer';
    labelClasses += 'max-w-[110px] opacity-100 mr-1.5';
    dotClasses += 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
    iconClasses += 'text-red-400';
    labelText = 'Sync failed';
    title = `Sync failed: ${state.catalogSyncError}. Click to retry`;
  } else if (isLoading) {
    btnClasses += 'px-2.5 border-sky-500/40 bg-sky-500/10 text-sky-300 cursor-wait';
    labelClasses += 'max-w-[95px] opacity-100 mr-1.5';
    dotClasses += 'bg-sky-400 animate-pulse';
    iconClasses += 'spin text-sky-400';
    labelText = 'Syncing...';
    title = 'Syncing rulesets...';
  } else {
    btnClasses += 'w-8 px-0 border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 cursor-pointer';
    labelClasses += 'max-w-0 opacity-0 pointer-events-none mr-0';
  }

  return `
    <button id="cat-refresh-btn" type="button" title="${escapeHtml(title)}" class="${btnClasses}">
      <span id="cat-sync-label" class="${labelClasses}">
        <span id="cat-sync-dot" class="${dotClasses}"></span>
        <span id="cat-sync-text" class="font-mono text-[11px]">${labelText}</span>
      </span>
      <svg id="cat-refresh-icon" class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </button>
  `;
}

function updateCatalogSyncStatusUI() {
  const btn = document.getElementById('cat-refresh-btn');
  const label = document.getElementById('cat-sync-label');
  const dot = document.getElementById('cat-sync-dot');
  const txt = document.getElementById('cat-sync-text');
  const icon = document.getElementById('cat-refresh-icon');

  if (!btn || !label || !dot || !txt || !icon) {
    const wrap = document.getElementById('cat-sync-wrapper');
    if (wrap) {
      wrap.innerHTML = renderCatalogSyncButton();
      const newBtn = document.getElementById('cat-refresh-btn');
      if (newBtn) newBtn.addEventListener('click', () => fetchCatalog(true));
    }
    return;
  }

  const isLoading = state.catalogLoading;
  const isError = !!state.catalogSyncError;

  if (isError) {
    btn.className = 'h-8 px-2.5 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-red-500/40 bg-red-500/10 text-red-300 hover:bg-red-500/20 hover:border-red-500/60 cursor-pointer';
    btn.title = `Sync failed: ${state.catalogSyncError}. Click to retry`;
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-[110px] opacity-100 mr-1.5';
    dot.className = 'w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)] flex-shrink-0';
    txt.textContent = 'Sync failed';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 text-red-400';
  } else if (isLoading) {
    btn.className = 'h-8 px-2.5 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-sky-500/40 bg-sky-500/10 text-sky-300 cursor-wait';
    btn.title = 'Syncing rulesets...';
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-[95px] opacity-100 mr-1.5';
    dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse flex-shrink-0';
    txt.textContent = 'Syncing...';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 spin text-sky-400';
  } else {
    btn.className = 'h-8 w-8 px-0 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 cursor-pointer';
    btn.title = 'Refresh catalog';
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-0 opacity-0 pointer-events-none mr-0';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200';
  }
}

async function fetchCatalog(refresh = false) {
  state.catalogLoading = true;
  state.catalogSyncError = null;
  updateCatalogSyncStatusUI();
  if (state.currentTab === 'catalog') {
    const refreshIcon = document.getElementById('cat-refresh-icon');
    if (refreshIcon) refreshIcon.classList.add('spin');
    updateCatalogTable();
  }
  try {
    const res = await API.getCatalog(refresh);
    state.catalog = res.items || [];
    state.catalogMap = {};
    for (let i = 0; i < state.catalog.length; i++) {
      const it = state.catalog[i];
      state.catalogMap[it.path] = it;
      if (!state.catalogMap[it.name]) state.catalogMap[it.name] = it;
    }
    state.catalogLoadedAt = res.loaded_at || '';
    state.catalogWarning = res.warning || '';
    state.catalogSyncError = null;
  } catch (err) {
    state.catalogSyncError = err.message || 'Sync failed';
    showToast('Catalog load error: ' + err.message, 'error');
  } finally {
    state.catalogLoading = false;
    const refreshIcon = document.getElementById('cat-refresh-icon');
    if (refreshIcon) refreshIcon.classList.remove('spin');
    updateCatalogSyncStatusUI();
    if (state.currentTab === 'catalog') {
      updateFilterCounts();
      updateCatalogHeaderFilters();
      updateCatalogTable();
    } else {
      render();
    }
  }
}

function updateGlobalQuicUI() {
  const isBlocked = state.local && !!state.local.global_quic_blocked;
  const btn = document.getElementById('btn-toggle-quic');
  const dot = document.getElementById('global-quic-indicator');
  const txt = document.getElementById('global-quic-text');
  if (!btn || !dot || !txt) return;

  if (isBlocked) {
    dot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)]';
    btn.className = 'h-8 px-3 text-xs font-medium border border-amber-500/40 bg-amber-500/10 text-amber-200 hover:bg-amber-500/20 rounded-md transition-all flex items-center gap-2 shadow-sm';
    txt.textContent = 'Block All QUIC: ON';
  } else {
    dot.className = 'w-2 h-2 rounded-full bg-zinc-600';
    btn.className = 'h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 rounded-md transition-all flex items-center gap-2 shadow-sm';
    txt.textContent = 'Block All QUIC: OFF';
  }
}

async function pingMihomoStatus() {
  const icon = document.getElementById('stat-mihomo-ping-icon');
  const dot = document.getElementById('stat-mihomo-dot');
  if (icon) icon.classList.add('spin');
  if (dot) dot.className = 'w-2 h-2 rounded-full bg-zinc-500 animate-pulse flex-shrink-0';

  try {
    const status = await API.getMihomoStatus();
    renderMihomoStatus(status);
  } catch (err) {
    renderMihomoStatus({ alive: false, error: 'Unreachable' });
  } finally {
    if (icon) icon.classList.remove('spin');
  }
}

function renderMihomoStatus(status) {
  const dot = document.getElementById('stat-mihomo-dot');
  const txt = document.getElementById('stat-mihomo-status');
  const ver = document.getElementById('stat-mihomo-version');
  const card = document.getElementById('card-mihomo-status');
  if (!dot || !txt || !card || !ver) return;

  if (status && status.alive) {
    card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs cursor-pointer hover:border-zinc-700 transition-all duration-300 ease-out select-none group shadow-sm';
    dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)] flex-shrink-0 transition-colors duration-200';
    txt.className = 'text-xs font-medium text-zinc-200 transition-colors duration-200 whitespace-nowrap';
    txt.textContent = 'Active';

    if (status.version && status.version !== 'Connected') {
      ver.textContent = status.version;
      ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-[80px] opacity-100 px-1.5 py-0.2 rounded bg-zinc-800/90 text-zinc-300 border border-zinc-700/60 font-mono text-[10px] leading-tight flex items-center justify-center';
    } else {
      ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 px-0 py-0 border-transparent text-[10px] font-mono leading-tight';
    }

    const cfgPath = (state.local && state.local.config_path) || '';
    card.title = `Mihomo is online${status.version ? ' (' + status.version + ')' : ''}${cfgPath ? '\nConfig: ' + cfgPath : ''}\nClick to ping`;
  } else {
    const isUnauth = status && status.error && status.error.toLowerCase().includes('unauthorized');
    if (isUnauth) {
      card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/40 text-xs cursor-pointer hover:border-amber-500/60 transition-all duration-300 ease-out select-none group shadow-sm';
      dot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)] flex-shrink-0 transition-colors duration-200';
      txt.className = 'text-xs font-medium text-amber-300 transition-colors duration-200 whitespace-nowrap';
      txt.textContent = 'Unauthorized';
    } else {
      card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-red-500/10 border border-red-500/40 text-xs cursor-pointer hover:border-red-500/60 transition-all duration-300 ease-out select-none group shadow-sm';
      dot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)] flex-shrink-0 transition-colors duration-200';
      txt.className = 'text-xs font-medium text-red-300 transition-colors duration-200 whitespace-nowrap';
      txt.textContent = 'Unreachable';
    }

    ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 px-0 py-0 border-transparent text-[10px] font-mono leading-tight';

    const errMsg = (status && status.error) ? status.error : 'Connection refused';
    card.title = `Mihomo status: ${errMsg}\nClick to retry ping`;
  }
}

function updateStats() {
  if (!state.local) return;
  const activeCount = (state.local.rules || []).filter(r => r.trim().startsWith('RULE-SET,')).length;
  const fileCount = (state.local.disk_files || []).length;

  const tabActiveBadge = document.getElementById('tab-count-active');
  if (tabActiveBadge) {
    tabActiveBadge.textContent = activeCount;
    tabActiveBadge.classList.remove('hidden');
  }
  const tabFilesBadge = document.getElementById('tab-count-files');
  if (tabFilesBadge) {
    tabFilesBadge.textContent = fileCount;
    tabFilesBadge.classList.remove('hidden');
  }

  if (state.local.mihomo_status) {
    renderMihomoStatus(state.local.mihomo_status);
  }
  updateGlobalQuicUI();
}

function render() {
  const content = document.getElementById('tab-content');
  if (state.currentTab === 'catalog') {
    content.innerHTML = renderCatalogView();
    bindCatalogEvents();
  } else if (state.currentTab === 'active') {
    content.innerHTML = renderActiveRulesView();
    bindActiveEvents();
  } else if (state.currentTab === 'local') {
    content.innerHTML = renderLocalView();
    bindLocalEvents();
  }
}

function getFilteredCatalog() {
  const q = state.searchQuery.trim().toLowerCase();
  const activeOnly = state.categoryFilter === 'applied';

  return state.catalog.filter(item => {
    if (activeOnly && !item.applied) return false;
    if (state.selectedCategories.size > 0 && !state.selectedCategories.has(item.category)) return false;
    if (state.selectedBehaviors.size > 0 && !state.selectedBehaviors.has(item.behavior)) return false;
    if (q && !item.name.toLowerCase().includes(q) && !item.path.toLowerCase().includes(q)) return false;
    return true;
  });
}

function getCatalogCategories() {
  const map = {};
  for (let i = 0; i < state.catalog.length; i++) {
    const c = state.catalog[i].category || 'other';
    map[c] = (map[c] || 0) + 1;
  }
  return Object.keys(map).sort().map(k => ({ name: k, count: map[k] }));
}

function getCatalogBehaviors() {
  const map = {};
  for (let i = 0; i < state.catalog.length; i++) {
    const b = state.catalog[i].behavior || 'other';
    map[b] = (map[b] || 0) + 1;
  }
  return Object.keys(map).sort().map(k => ({ name: k, count: map[k] }));
}

function updateCatalogTable() {
  const tbody = document.getElementById('cat-tbody');
  const pag = document.getElementById('cat-pagination');
  if (!tbody) return;

  if (state.catalogLoading && state.catalog.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="py-12 text-center text-zinc-500 font-mono">
          <div class="w-5 h-5 border-2 border-zinc-400 border-t-transparent rounded-full spin mx-auto mb-2"></div>
          Synchronizing catalog tree...
        </td>
      </tr>
    `;
    if (pag) pag.innerHTML = '';
    return;
  }

  const filtered = getFilteredCatalog();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;

  if (total === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="py-12 text-center text-zinc-500">
          No matching rulesets found in catalog.
        </td>
      </tr>
    `;
    if (pag) {
      pag.innerHTML = `<div class="text-[11px] text-zinc-500 font-mono">0 of ${state.catalog.length} rulesets</div>`;
    }
    return;
  }

  const startIdx = (state.page - 1) * state.pageSize;
  const endIdx = Math.min(startIdx + state.pageSize, total);
  const pageItems = filtered.slice(startIdx, endIdx);

  let rowsHtml = '';
  for (let i = 0; i < pageItems.length; i++) {
    const item = pageItems[i];
    rowsHtml += `
      <tr class="hover:bg-zinc-900/50 transition-colors ${item.applied ? 'bg-zinc-900/20' : ''}">
        <td class="py-2.5 px-4 font-mono">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-zinc-200">${escapeHtml(item.name)}</span>
            ${item.applied ? `
              <span class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-400 font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Active
              </span>
            ` : ''}
            ${item.block_quic ? `
              <span class="inline-flex items-center text-[9px] font-mono px-1 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">QUIC</span>
            ` : ''}
          </div>
          <div class="text-[11px] text-zinc-500 font-mono truncate max-w-xs sm:max-w-sm">${escapeHtml(item.path)}</div>
        </td>
        <td class="py-2.5 px-4">
          <span class="inline-flex items-center text-[10px] font-mono px-2 py-0.5 rounded border ${
            item.category === 'geosite'
              ? 'bg-sky-500/10 text-sky-400 border-sky-500/20'
              : 'bg-purple-500/10 text-purple-400 border-purple-500/20'
          }">${escapeHtml(item.category)}</span>
        </td>
        <td class="py-2.5 px-4 font-mono text-zinc-400">${escapeHtml(item.behavior)}</td>
        <td class="py-2.5 px-4 font-mono text-zinc-400">${formatBytes(item.size)}</td>
        <td class="py-2.5 px-4 text-right whitespace-nowrap">
          <button data-preview-rule="${escapeHtml(item.name)}" data-preview-url="${escapeHtml(item.url)}" title="Preview ruleset contents" class="h-7 px-2 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-100 rounded border border-zinc-800 transition-colors mr-1 inline-flex items-center gap-1">
            <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            View
          </button>
          ${item.applied ? `
            <button data-edit-rule="${escapeHtml(item.applied_name || item.name)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded border border-zinc-700 transition-colors mr-1">
              Edit
            </button>
            <button data-remove-name="${escapeHtml(item.applied_name || item.name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
              Remove
            </button>
          ` : `
            <button data-add-path="${escapeHtml(item.path)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded transition-colors shadow-sm font-semibold">
              Add Rule
            </button>
          `}
        </td>
      </tr>
    `;
  }
  tbody.innerHTML = rowsHtml;

  if (pag) {
    pag.innerHTML = `
      <div class="text-[11px] text-zinc-500 font-mono">
        Showing <span class="text-zinc-300 font-semibold">${startIdx + 1}</span>–<span class="text-zinc-300 font-semibold">${endIdx}</span> of <span class="text-zinc-300 font-semibold">${total}</span> rulesets
        ${state.catalog.length !== total ? `<span class="text-zinc-600">(filtered from ${state.catalog.length})</span>` : ''}
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] text-zinc-500 font-mono">Per page:</span>
          <select id="cat-pagesize-select" class="h-7 px-2 bg-zinc-900 border border-zinc-800 rounded text-[11px] text-zinc-200 font-mono focus:outline-none focus:border-zinc-500">
            <option value="25" ${state.pageSize === 25 ? 'selected' : ''}>25</option>
            <option value="50" ${state.pageSize === 50 ? 'selected' : ''}>50</option>
            <option value="100" ${state.pageSize === 100 ? 'selected' : ''}>100</option>
            <option value="200" ${state.pageSize === 200 ? 'selected' : ''}>200</option>
          </select>
        </div>

        <div class="flex items-center gap-1">
          <button id="cat-page-first" ${state.page <= 1 ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            «
          </button>
          <button id="cat-page-prev" ${state.page <= 1 ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            ‹ Prev
          </button>

          <span class="px-2 text-[11px] font-mono text-zinc-400">
            Page <span class="text-zinc-100 font-semibold">${state.page}</span> / <span class="text-zinc-400">${totalPages}</span>
          </span>

          <button id="cat-page-next" ${state.page >= totalPages ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            Next ›
          </button>
          <button id="cat-page-last" ${state.page >= totalPages ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            »
          </button>
        </div>
      </div>
    `;

    const prevBtn = document.getElementById('cat-page-prev');
    if (prevBtn && state.page > 1) {
      prevBtn.onclick = () => { state.page--; updateCatalogTable(); };
    }
    const nextBtn = document.getElementById('cat-page-next');
    if (nextBtn && state.page < totalPages) {
      nextBtn.onclick = () => { state.page++; updateCatalogTable(); };
    }
    const firstBtn = document.getElementById('cat-page-first');
    if (firstBtn && state.page > 1) {
      firstBtn.onclick = () => { state.page = 1; updateCatalogTable(); };
    }
    const lastBtn = document.getElementById('cat-page-last');
    if (lastBtn && state.page < totalPages) {
      lastBtn.onclick = () => { state.page = totalPages; updateCatalogTable(); };
    }
    const sizeSelect = document.getElementById('cat-pagesize-select');
    if (sizeSelect) {
      sizeSelect.onchange = (e) => {
        state.pageSize = parseInt(e.target.value, 10) || 50;
        state.page = 1;
        updateCatalogTable();
      };
    }
  }
}

function bindCatalogEvents() {
  const searchInput = document.getElementById('cat-search');
  if (searchInput) {
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.searchQuery = e.target.value;
        state.page = 1;
        updateCatalogTable();
      }, 70);
    });
  }

  document.querySelectorAll('[data-cat-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.categoryFilter = btn.dataset.catFilter;
      state.page = 1;
      document.querySelectorAll('[data-cat-filter]').forEach(b => {
        const active = b.dataset.catFilter === state.categoryFilter;
        b.className = `h-8 px-3 text-xs font-medium rounded-md border transition-colors ${
          active ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'
        }`;
      });
      updateCatalogTable();
    });
  });

  const refBtn = document.getElementById('cat-refresh-btn');
  if (refBtn) {
    refBtn.addEventListener('click', () => fetchCatalog(true));
  }

  const tbody = document.getElementById('cat-tbody');
  if (tbody) {
    tbody.addEventListener('click', (e) => {
      const previewBtn = e.target.closest('[data-preview-rule]');
      if (previewBtn) {
        openPreviewModal(previewBtn.dataset.previewRule, previewBtn.dataset.previewUrl);
        return;
      }
      const editBtn = e.target.closest('[data-edit-rule]');
      if (editBtn) {
        openEditRuleModal(editBtn.dataset.editRule);
        return;
      }
      const addBtn = e.target.closest('[data-add-path]');
      if (addBtn) {
        const item = state.catalogMap[addBtn.dataset.addPath];
        if (item) openAddRuleModal(item);
        return;
      }
      const removeBtn = e.target.closest('[data-remove-name]');
      if (removeBtn) {
        confirmDeleteRule(removeBtn.dataset.removeName);
        return;
      }
    });
  }

  bindFilterDropdowns();
  updateCatalogTable();
}

function updateCatalogHeaderFilters() {
  const thCat = document.getElementById('th-category');
  const thBeh = document.getElementById('th-behavior');
  if (thCat) thCat.innerHTML = renderCategoryFilterHeader();
  if (thBeh) thBeh.innerHTML = renderBehaviorFilterHeader();
  bindFilterDropdowns();
}

function bindFilterDropdowns() {
  const btnCat = document.getElementById('btn-filter-cat');
  const menuCat = document.getElementById('menu-filter-cat');
  const btnBeh = document.getElementById('btn-filter-beh');
  const menuBeh = document.getElementById('menu-filter-beh');

  if (btnCat && menuCat) {
    btnCat.onclick = (e) => {
      e.stopPropagation();
      menuCat.classList.toggle('hidden');
      if (menuBeh) menuBeh.classList.add('hidden');
    };
    menuCat.onclick = (e) => e.stopPropagation();
  }

  if (btnBeh && menuBeh) {
    btnBeh.onclick = (e) => {
      e.stopPropagation();
      menuBeh.classList.toggle('hidden');
      if (menuCat) menuCat.classList.add('hidden');
    };
    menuBeh.onclick = (e) => e.stopPropagation();
  }

  document.querySelectorAll('[data-cat-choice]').forEach(cb => {
    cb.onchange = () => {
      const cat = cb.dataset.catChoice;
      if (cb.checked) {
        state.selectedCategories.add(cat);
      } else {
        state.selectedCategories.delete(cat);
      }
      state.page = 1;
      updateCatalogTable();
      updateCatalogHeaderFilters();
      const m = document.getElementById('menu-filter-cat');
      if (m) m.classList.remove('hidden');
    };
  });

  document.querySelectorAll('[data-beh-choice]').forEach(cb => {
    cb.onchange = () => {
      const beh = cb.dataset.behChoice;
      if (cb.checked) {
        state.selectedBehaviors.add(beh);
      } else {
        state.selectedBehaviors.delete(beh);
      }
      state.page = 1;
      updateCatalogTable();
      updateCatalogHeaderFilters();
      const m = document.getElementById('menu-filter-beh');
      if (m) m.classList.remove('hidden');
    };
  });

  const resetCat = document.getElementById('btn-reset-cat');
  if (resetCat) {
    resetCat.onclick = () => {
      state.selectedCategories.clear();
      state.page = 1;
      updateCatalogTable();
      updateCatalogHeaderFilters();
      const m = document.getElementById('menu-filter-cat');
      if (m) m.classList.remove('hidden');
    };
  }

  const resetBeh = document.getElementById('btn-reset-beh');
  if (resetBeh) {
    resetBeh.onclick = () => {
      state.selectedBehaviors.clear();
      state.page = 1;
      updateCatalogTable();
      updateCatalogHeaderFilters();
      const m = document.getElementById('menu-filter-beh');
      if (m) m.classList.remove('hidden');
    };
  }
}

document.addEventListener('click', () => {
  const menuCat = document.getElementById('menu-filter-cat');
  const menuBeh = document.getElementById('menu-filter-beh');
  if (menuCat) menuCat.classList.add('hidden');
  if (menuBeh) menuBeh.classList.add('hidden');
});

function renderActiveRulesView() {
  if (!state.local) return '<div class="text-center py-12 text-zinc-500 font-mono">Loading config...</div>';

  const rules = (state.local.rules || []).filter(r => r.trim().startsWith('RULE-SET,'));
  const providersMap = {};
  (state.local.rule_providers || []).forEach(p => { providersMap[p.name] = p; });

  const diskMap = {};
  (state.local.disk_files || []).forEach(f => { diskMap[f.name.toLowerCase()] = f; });

  return `
    <div class="space-y-4 w-full">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-zinc-100">Registered Rule Directives</h2>
          <p class="text-xs text-zinc-500">Mihomo traffic matching these sets is forwarded to target proxy groups</p>
        </div>
        <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2.5 py-1 rounded border border-zinc-800">${rules.length} active directives</span>
      </div>

                    <span class="inline-flex items-center text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-800 text-zinc-200 border border-zinc-700 font-semibold">

                  <td class="py-2.5 px-4 font-mono text-zinc-400">
                    ${prov ? escapeHtml(prov.behavior) : 'domain'}
                  </td>
                  <td class="py-2.5 px-4">
                    ${diskFile ? `
                      <span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-mono">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Downloaded (${formatBytes(diskFile.size)})

                    ` : `
                      <span class="inline-flex items-center gap-1.5 text-[11px] text-amber-400 font-mono">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                        Pending Core Download
                      </span>
                    `}
                  </td>
                  <td class="py-2.5 px-4 text-right whitespace-nowrap">
                    <button data-preview-rule="${escapeHtml(name)}" title="Preview ruleset contents" class="h-7 px-2 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-100 rounded border border-zinc-800 transition-colors mr-1 inline-flex items-center gap-1">
                      <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                      View
                    </button>
                    <button data-edit-rule="${escapeHtml(name)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded border border-zinc-700 transition-colors mr-1">
                      Edit
                    </button>
                    <button data-delete-rule="${escapeHtml(name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
                      Delete

function bindActiveEvents() {
  document.querySelectorAll('[data-preview-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      openPreviewModal(btn.dataset.previewRule, '');
    });
  });

  document.querySelectorAll('[data-edit-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      openEditRuleModal(btn.dataset.editRule);
    });
  });

  document.querySelectorAll('[data-delete-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      confirmDeleteRule(btn.dataset.deleteRule);
    });
  });
}

function openAddRuleModal(preset = null) {
  if (!state.local || (state.local.proxy_groups || []).length === 0) {
    showToast('No proxy groups detected in Mihomo config.yaml', 'error');
    return;
  }

  const groups = state.local.proxy_groups || ['DIRECT', 'REJECT'];
  const defaultGroup = groups.includes('UNBLOCK') ? 'UNBLOCK' :
                       groups.includes('PROXY') ? 'PROXY' :
                       groups.includes('STABLE') ? 'STABLE' : groups[0];

  const modal = document.getElementById('modal-container');
  const isCustom = !preset;
  const initialName = preset ? (preset.category === 'geoip' ? 'geoip-' + preset.name : preset.name) : '';
  const initialUrl = preset ? preset.url : '';
  const initialBehavior = preset ? preset.behavior : 'domain';

  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-lg w-full space-y-5 shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="font-semibold text-sm text-zinc-100">${isCustom ? 'Register Custom Ruleset' : 'Add Ruleset to Mihomo'}</h3>
          <p class="text-xs text-zinc-500 mt-0.5">Configuration will be persisted and reloaded instantly</p>
        </div>
        <button id="modal-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Provider Name (Rule-Set ID)</label>
          <input id="modal-name" type="text" value="${escapeHtml(initialName)}" placeholder="e.g. youtube or my-domains" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Download URL (.mrs file)</label>
          <input id="modal-url" type="text" value="${escapeHtml(initialUrl)}" placeholder="https://..." class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-300 mb-1 font-medium">Behavior</label>
            <select id="modal-behavior" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 focus:border-zinc-500 focus:outline-none">
              <option value="domain" ${initialBehavior === 'domain' ? 'selected' : ''}>domain (geosite)</option>
              <option value="ipcidr" ${initialBehavior === 'ipcidr' ? 'selected' : ''}>ipcidr (geoip)</option>
              <option value="classical" ${initialBehavior === 'classical' ? 'selected' : ''}>classical</option>
            </select>
          </div>

          <div>
            <label class="block text-zinc-300 mb-1 font-medium">Format</label>
            <select id="modal-format" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 focus:border-zinc-500 focus:outline-none">
              <option value="mrs" selected>mrs (binary)</option>
              <option value="yaml">yaml</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Target Proxy Group</label>
          <select id="modal-group" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-medium focus:border-zinc-500 focus:outline-none">
            ${groups.map(g => `<option value="${escapeHtml(g)}" ${g === defaultGroup ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>

        <label class="flex items-start gap-2.5 p-3 rounded-md bg-zinc-900/60 border border-zinc-800 cursor-pointer hover:border-zinc-700 transition-colors">
          <input id="modal-quic" type="checkbox" class="mt-0.5 rounded bg-zinc-950 border-zinc-700">
          <div>
            <div class="font-semibold text-zinc-200 text-xs flex items-center gap-1.5">
              Block QUIC traffic
              <span class="text-[10px] font-mono text-amber-400 bg-amber-500/10 px-1.5 py-0.2 rounded border border-amber-500/20">UDP 443 → REJECT</span>
            </div>
            <p class="text-[11px] text-zinc-400 mt-0.5 leading-relaxed">
              Forces clients (YouTube, Google) to fallback from HTTP/3 to HTTPS (TCP), preventing ISP UDP throttling and timeouts.
            </p>
          </div>
        </label>
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-zinc-800">
        <button id="modal-cancel-btn" class="h-8 px-3 rounded-md text-xs font-medium text-zinc-300 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition-colors">Cancel</button>
        <button id="modal-submit-btn" class="h-8 px-3 rounded-md text-xs font-semibold bg-zinc-100 hover:bg-zinc-200 text-zinc-950 transition-colors">Apply & Reload</button>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel-btn').onclick = closeModal;
  modal.onclick = closeModal;

  document.getElementById('modal-submit-btn').onclick = async () => {
    const name = document.getElementById('modal-name').value.trim();
    const url = document.getElementById('modal-url').value.trim();
    const behavior = document.getElementById('modal-behavior').value;
    const format = document.getElementById('modal-format').value;
    const proxyGroup = document.getElementById('modal-group').value;
    const blockQuic = document.getElementById('modal-quic').checked;

    if (!name || !url || !proxyGroup) {
      showToast('Please fill all fields', 'error');
      return;
    }

    const submitBtn = document.getElementById('modal-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    try {
      const res = await API.addRule({
        name: name,
        url: url,
        behavior: behavior,
        format: format,
        proxy_group: proxyGroup,
        block_quic: blockQuic
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      showToast(`Rule ${name} added and reloaded`, 'success');
      closeModal();
      await fetchLocal();
      await fetchCatalog(false);
    } catch (err) {
      showToast(err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Apply & Reload';
    }
  };

  document.getElementById('modal-name').focus();
}

function openEditRuleModal(name) {
  if (!state.local) return;
  const groups = state.local.proxy_groups || ['DIRECT', 'REJECT'];

  let currentGroup = groups[0];
  (state.local.rules || []).forEach(r => {
    const parts = r.split(',').map(s => s.trim());
    if (parts.length >= 3 && parts[0].toUpperCase() === 'RULE-SET' && parts[1].toLowerCase() === name.toLowerCase()) {
      currentGroup = parts[2];
    }
  });

  const prov = (state.local.rule_providers || []).find(p => p.name.toLowerCase() === name.toLowerCase());
  const isQuic = (state.local.quic_blocked || []).some(q => q.toLowerCase() === name.toLowerCase());

  const currentUrl = prov ? prov.url : '';
  const currentBehavior = prov ? prov.behavior : 'domain';
  const currentFormat = prov ? prov.format : 'mrs';

  const modal = document.getElementById('modal-container');
  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-lg w-full space-y-5 shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <div>
          <h3 class="font-semibold text-sm text-zinc-100">Edit Ruleset Directive</h3>
          <p class="text-xs text-zinc-500 font-mono mt-0.5">${escapeHtml(name)}</p>
        </div>
        <button id="modal-edit-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Target Proxy Group</label>
          <select id="modal-edit-group" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-medium focus:border-zinc-500 focus:outline-none">
            ${groups.map(g => `<option value="${escapeHtml(g)}" ${g === currentGroup ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>

        <label class="flex items-start gap-2.5 p-3 rounded-md bg-zinc-900/60 border border-zinc-800 cursor-pointer hover:border-zinc-700 transition-colors">
          <input id="modal-edit-quic" type="checkbox" ${isQuic ? 'checked' : ''} class="mt-0.5 rounded bg-zinc-950 border-zinc-700">
          <div>
            <div class="font-semibold text-zinc-200 text-xs flex items-center gap-1.5">
              Block QUIC traffic
              <span class="text-[10px] font-mono text-amber-400 bg-amber-500/10 px-1.5 py-0.2 rounded border border-amber-500/20 font-medium">UDP 443 → REJECT</span>
            </div>
            <p class="text-[11px] text-zinc-400 mt-0.5 leading-relaxed">
              Forces clients (YouTube, Google) to fallback from HTTP/3 to HTTPS (TCP), preventing ISP UDP throttling and timeouts.
            </p>
          </div>
        </label>

        ${prov ? `
          <div class="pt-2 border-t border-zinc-800/80 space-y-3">
            <div class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider">Provider Settings</div>
            <div>
              <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Download URL (.mrs)</label>
              <input id="modal-edit-url" type="text" value="${escapeHtml(currentUrl)}" class="h-8 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-200 font-mono focus:border-zinc-500 focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Behavior</label>
                <select id="modal-edit-behavior" class="h-8 w-full px-2.5 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-200 focus:border-zinc-500 focus:outline-none">
                  <option value="domain" ${currentBehavior === 'domain' ? 'selected' : ''}>domain</option>
                  <option value="ipcidr" ${currentBehavior === 'ipcidr' ? 'selected' : ''}>ipcidr</option>
                  <option value="classical" ${currentBehavior === 'classical' ? 'selected' : ''}>classical</option>
                </select>
              </div>
              <div>
                <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Format</label>
                <select id="modal-edit-format" class="h-8 w-full px-2.5 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-200 focus:border-zinc-500 focus:outline-none">
                  <option value="mrs" ${currentFormat === 'mrs' ? 'selected' : ''}>mrs (binary)</option>
                  <option value="yaml" ${currentFormat === 'yaml' ? 'selected' : ''}>yaml</option>
                </select>
              </div>
            </div>
          </div>
        ` : ''}
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-zinc-800">
        <button id="modal-edit-cancel" class="h-8 px-3 rounded-md text-xs font-medium text-zinc-300 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition-colors">Cancel</button>
        <button id="modal-edit-save" class="h-8 px-3 rounded-md text-xs font-semibold bg-zinc-100 hover:bg-zinc-200 text-zinc-950 transition-colors">Save & Reload</button>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-edit-close').onclick = closeModal;
  document.getElementById('modal-edit-cancel').onclick = closeModal;
  modal.onclick = closeModal;

  document.getElementById('modal-edit-save').onclick = async () => {
    const proxyGroup = document.getElementById('modal-edit-group').value;
    const blockQuic = document.getElementById('modal-edit-quic').checked;
    const urlInput = document.getElementById('modal-edit-url');
    const behaviorSelect = document.getElementById('modal-edit-behavior');
    const formatSelect = document.getElementById('modal-edit-format');

    const saveBtn = document.getElementById('modal-edit-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      const payload = {
        name: name,
        proxy_group: proxyGroup,
        block_quic: blockQuic,
      };
      if (urlInput) payload.url = urlInput.value.trim();
      if (behaviorSelect) payload.behavior = behaviorSelect.value;
      if (formatSelect) payload.format = formatSelect.value;

      const res = await API.editRule(payload);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to update rule');

      showToast(`Rule ${name} updated successfully`, 'success');
      closeModal();
      await fetchLocal();
      await fetchCatalog(false);
    } catch (err) {
      showToast(err.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save & Reload';
    }
  };
}

        <button id="modal-del-confirm" class="h-8 px-3 rounded-md text-xs font-medium text-red-400 bg-red-500/10 border border-red-500/20 hover:bg-red-500/20 transition-colors">Delete</button>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-del-cancel').onclick = closeModal;
  modal.onclick = closeModal;

  document.getElementById('modal-del-confirm').onclick = async () => {
    const deleteFile = document.getElementById('modal-del-file').checked;
    const btn = document.getElementById('modal-del-confirm');
    btn.disabled = true;
    btn.textContent = 'Removing...';

    try {
      const res = await API.deleteRule(name, deleteFile);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      showToast(`Removed ${name}`, 'success');
      closeModal();
      await fetchLocal();
      await fetchCatalog(false);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  };
}

async function openPreviewModal(name, url) {
  const modal = document.getElementById('modal-container');
  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-2xl w-full space-y-4 shadow-2xl relative flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <div>
          <h3 class="font-semibold text-sm text-zinc-100 flex items-center gap-2">
            Rule Preview: <span class="font-mono text-zinc-200">${escapeHtml(name || url)}</span>
          </h3>
          <p class="text-xs text-zinc-500 mt-0.5">Fetching and decoding ruleset content...</p>
        </div>
        <button id="modal-preview-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div id="preview-body" class="flex-1 flex flex-col items-center justify-center py-12 text-zinc-500 font-mono text-xs">
        <div class="w-5 h-5 border-2 border-zinc-400 border-t-transparent rounded-full spin mb-2"></div>
        Downloading & decoding MRS payload...
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-preview-close').onclick = closeModal;
  modal.onclick = closeModal;

  try {
    const data = await API.previewRule(name, url);
    renderPreviewContent(data, closeModal);
  } catch (err) {
    const body = document.getElementById('preview-body');
    if (body) {
      body.innerHTML = `
        <div class="text-center space-y-2 py-6">
          <div class="text-red-400 font-medium">Failed to load rule preview</div>
          <div class="text-zinc-500 text-[11px] max-w-md font-mono">${escapeHtml(err.message)}</div>
          <button id="preview-retry" class="mt-2 h-7 px-3 text-xs bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-300 rounded">Retry</button>
        </div>
      `;
      const retry = document.getElementById('preview-retry');
      if (retry) retry.onclick = () => openPreviewModal(name, url);
    }
  }
}

function renderPreviewContent(data, closeModal) {
  const modal = document.getElementById('modal-container');
  const allRules = data.rules || [];
  let filteredRules = allRules;

  const sourceBadge = data.source === 'local'
    ? '<span class="px-2 py-0.5 text-[10px] font-mono rounded border bg-emerald-500/10 text-emerald-400 border-emerald-500/20 font-medium">Local Disk</span>'
    : '<span class="px-2 py-0.5 text-[10px] font-mono rounded border bg-sky-500/10 text-sky-400 border-sky-500/20 font-medium">Remote GitHub</span>';

  const typeBadge = `<span class="px-2 py-0.5 text-[10px] font-mono rounded border bg-purple-500/10 text-purple-400 border-purple-500/20 uppercase font-medium">${escapeHtml(data.type || 'mrs')}</span>`;

  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-3xl w-full space-y-4 shadow-2xl relative flex flex-col max-h-[88vh]" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-semibold text-sm text-zinc-100 font-mono">${escapeHtml(data.name)}</h3>
            ${sourceBadge}
            ${typeBadge}
            <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${data.count.toLocaleString()} rules</span>
          </div>
          <p class="text-xs text-zinc-500 mt-1">Decoded rule list representation</p>
        </div>
        <button id="modal-preview-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div class="flex items-center justify-between gap-3 pt-1">
        <div class="relative flex-1">
          <svg class="w-3.5 h-3.5 absolute left-2.5 top-2 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="preview-search" type="text" placeholder="Filter rules inside (e.g. .com, 1.1.1)..." class="h-8 w-full pl-8 pr-3 bg-zinc-900 border border-zinc-800 rounded text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 font-mono">
        </div>
        <div class="flex items-center gap-2">
          <span id="preview-match-count" class="text-[11px] font-mono text-zinc-500 whitespace-nowrap">${allRules.length.toLocaleString()} total</span>
          <button id="preview-copy-btn" class="h-8 px-2.5 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-200 rounded border border-zinc-800 transition-colors flex items-center gap-1.5 shadow-sm">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span id="preview-copy-text">Copy All</span>
          </button>
          <button id="preview-download-btn" class="h-8 px-2.5 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-200 rounded border border-zinc-800 transition-colors flex items-center gap-1.5 shadow-sm">
            <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            .txt
          </button>
        </div>
      </div>

      <div class="flex-1 min-h-[320px] max-h-[55vh] overflow-y-auto border border-zinc-800 rounded-md bg-zinc-950/80 p-3 font-mono text-xs select-all leading-relaxed" id="preview-rules-container">
        <pre id="preview-rules-pre" class="text-zinc-300 font-mono whitespace-pre">${escapeHtml(allRules.join('\n'))}</pre>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-zinc-800/80 text-xs">
        <span class="text-[11px] text-zinc-500 font-mono">Tip: Select all with Ctrl+A or use the search bar</span>
        <button id="preview-close-footer" class="h-8 px-4 rounded-md text-xs font-medium text-zinc-300 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition-colors">Close</button>
      </div>
    </div>
  `;

  document.getElementById('modal-preview-close').onclick = closeModal;
  document.getElementById('preview-close-footer').onclick = closeModal;
  modal.onclick = closeModal;

  const searchInput = document.getElementById('preview-search');
  const rulesPre = document.getElementById('preview-rules-pre');
  const matchCount = document.getElementById('preview-match-count');
  const copyBtn = document.getElementById('preview-copy-btn');
  const copyText = document.getElementById('preview-copy-text');
  const downloadBtn = document.getElementById('preview-download-btn');

  let filterTimeout;
  searchInput.oninput = (e) => {
    clearTimeout(filterTimeout);
    filterTimeout = setTimeout(() => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        filteredRules = allRules;
        rulesPre.textContent = allRules.join('\n');
        matchCount.textContent = `${allRules.length.toLocaleString()} total`;
      } else {
        filteredRules = allRules.filter(r => r.toLowerCase().includes(term));
        rulesPre.textContent = filteredRules.join('\n');
        matchCount.textContent = `${filteredRules.length.toLocaleString()} of ${allRules.length.toLocaleString()}`;
      }
    }, 80);
  };

  copyBtn.onclick = () => {
    const textToCopy = filteredRules.join('\n');
    navigator.clipboard.writeText(textToCopy).then(() => {
      copyText.textContent = 'Copied!';
      setTimeout(() => { copyText.textContent = 'Copy All'; }, 2000);
    }).catch(() => {
      showToast('Failed to copy to clipboard', 'error');
    });
  };

  downloadBtn.onclick = () => {
    const blob = new Blob([filteredRules.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${data.name || 'ruleset'}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

document.getElementById('btn-custom-rule').addEventListener('click', () => {
  openAddRuleModal(null);
});

document.getElementById('btn-reload-mihomo').addEventListener('click', async () => {
  const icon = document.getElementById('reload-icon');
  icon.classList.add('spin');
  try {
    const data = await API.reloadMihomo();
    if (data.status === 'ok') {
      showToast('Mihomo hot-reloaded successfully', 'success');
    } else {
      showToast(data.error || 'Hot-reload failed', 'error');
    }
  } catch (err) {
    showToast('Failed to reach Mihomo API: ' + err.message, 'error');
  } finally {
    icon.classList.remove('spin');
    await pingMihomoStatus();
  }
});

document.getElementById('card-mihomo-status')?.addEventListener('click', () => {
  pingMihomoStatus();
});

document.getElementById('btn-toggle-quic').addEventListener('click', async () => {
  const current = state.local && !!state.local.global_quic_blocked;
  const next = !current;
  const btn = document.getElementById('btn-toggle-quic');
  btn.disabled = true;
  try {
    const res = await API.toggleGlobalQuic(next);
    if (res.status === 'ok') {
      showToast(next ? 'Global QUIC blocked (all UDP 443 rejected)' : 'Global QUIC block disabled', next ? 'warning' : 'info');
      await fetchLocal();
    } else {
      showToast(res.error || 'Failed to toggle global QUIC', 'error');
    }
  } catch (err) {
    showToast('Failed to toggle QUIC: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

async function init() {
  await fetchLocal();
  await fetchCatalog(false);
  setTab('catalog');
  setInterval(pingMihomoStatus, 15000);
}

init();
</script>
</body>
</html>
