<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miru — Mihomo Rule Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
      },
      colors: {
        zinc: {
          950: '#09090b',
          900: '#18181b',
          800: '#27272a',
          700: '#3f3f46',
          600: '#52525b',
          500: '#71717a',
          400: '#a1a1aa',
          300: '#d4d4d8',
          200: '#e4e4e7',
          100: '#f4f4f5',
          50: '#fafafa',
        }
      }
    }
  }
}
</script>
<style>
  * { border-color: #27272a; }
  body { background-color: #09090b; color: #fafafa; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .toast-slide { animation: toastSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes toastSlide {
    from { transform: translateY(-8px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #09090b; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-zinc-800 selection:text-zinc-50">

<header class="w-full border-b border-zinc-800 bg-zinc-950/90 backdrop-blur sticky top-0 z-30">
  <div class="w-full px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-md bg-zinc-100 text-zinc-950 flex items-center justify-center font-bold text-sm tracking-tighter shadow-sm">
        M
      </div>
      <span class="font-semibold text-sm tracking-tight text-zinc-100 mr-0.5">Miru</span>

      <div id="card-mihomo-status" class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs cursor-pointer hover:border-zinc-700 transition-all duration-300 ease-out select-none group shadow-sm" title="Click to ping Mihomo API">
        <span id="stat-mihomo-dot" class="w-2 h-2 rounded-full bg-zinc-500 animate-pulse flex-shrink-0 transition-colors duration-200"></span>
        <span id="stat-mihomo-status" class="text-xs font-medium text-zinc-300 transition-colors duration-200 whitespace-nowrap">Checking...</span>
        <span id="stat-mihomo-version" class="overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 text-[10px] font-mono rounded bg-zinc-800/90 text-zinc-300 border border-transparent leading-tight flex items-center justify-center"></span>
        <svg id="stat-mihomo-ping-icon" class="w-2.5 h-2.5 text-zinc-500 group-hover:text-zinc-300 transition-colors ml-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btn-toggle-quic" title="Toggle global UDP port 443 block for all traffic" class="h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 rounded-md transition-all flex items-center gap-2 shadow-sm">
        <span id="global-quic-indicator" class="w-2 h-2 rounded-full bg-zinc-600 transition-colors"></span>
        <span id="global-quic-text">Block All QUIC</span>
      </button>

      <button id="btn-custom-rule" class="h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Custom MRS
      </button>

      <button id="btn-reload-mihomo" class="h-8 px-3 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-semibold">
        <svg id="reload-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reload Core
      </button>
    </div>
  </div>
</header>

<div class="w-full px-6 py-6 flex-1 space-y-6">

  <div class="border-b border-zinc-800">
    <nav class="flex space-x-6 -mb-px" id="tabs">
      <button data-tab="catalog" class="tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 border-zinc-100 text-zinc-100 font-semibold">
        <span>Rules Catalog</span>
      </button>
      <button data-tab="settings" class="tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700">
        <span>Settings</span>
        <span id="tab-count-settings" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/50">0</span>
      </button>
    </nav>
  </div>

  <main id="tab-content" class="w-full"></main>
</div>

<footer class="border-t border-zinc-800/80 py-4 px-6 text-xs text-zinc-500 flex items-center justify-between">
  <span>Miru · Embedded Linux / OpenWrt Mihomo Controller</span>
  <a href="https://github.com/paintingpromisesss/miru" target="_blank" rel="noopener" class="hover:text-zinc-300 transition-colors">GitHub Repository</a>
</footer>

<div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 max-w-sm w-full pointer-events-none px-4"></div>
<div id="modal-container" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4"></div>

<script>
const API = {
  getLocal: () => fetch('/api/local').then(r => r.json()),
  getCatalog: (refresh = false) => fetch('/api/catalog' + (refresh ? '?action=refresh' : '')).then(r => r.json()),
  addRule: (data) => fetch('/api/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  editRule: (data) => fetch('/api/rules', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  deleteRule: (name, deleteFile = true) => fetch(`/api/rules?name=${encodeURIComponent(name)}&delete_file=${deleteFile}`, {
    method: 'DELETE'
  }),
  addProxyGroup: (data) => fetch('/api/proxy-groups', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  editProxyGroup: (data) => fetch('/api/proxy-groups', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  deleteProxyGroup: (name) => fetch(`/api/proxy-groups?name=${encodeURIComponent(name)}`, {
    method: 'DELETE'
  }),
  addProxyProvider: (data) => fetch('/api/proxy-providers', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  editProxyProvider: (data) => fetch('/api/proxy-providers', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  deleteProxyProvider: (name) => fetch(`/api/proxy-providers?name=${encodeURIComponent(name)}`, {
    method: 'DELETE'
  }),
  addRawRule: (rule, index = -1) => fetch('/api/raw-rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ rule, index })
  }),
  editRawRule: (index, rule) => fetch('/api/raw-rules', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ index, rule })
  }),
  deleteRawRule: (index) => fetch(`/api/raw-rules?index=${index}`, {
    method: 'DELETE'
  }),
  moveRawRule: (from, to) => fetch('/api/raw-rules/move', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ from, to })
  }),
  toggleGlobalQuic: (enabled) => fetch('/api/quic/global', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ enabled })
  }).then(r => r.json()),
  reloadMihomo: () => fetch('/api/reload', { method: 'POST' }).then(r => r.json()),
  getMihomoStatus: () => fetch('/api/mihomo/status').then(r => r.json()),
  previewRule: (name, url) => {
    let q = [];
    if (name) q.push(`name=${encodeURIComponent(name)}`);
    if (url) q.push(`url=${encodeURIComponent(url)}`);
    return fetch(`/api/rules/preview?${q.join('&')}`).then(async r => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    });
  }
};

let state = {
  currentTab: 'catalog',
  settingsSubTab: 'groups', // 'groups' | 'providers' | 'rules' | 'directives'
  groupSearch: '',
  groupTypeFilter: 'all',
  providerSearch: '',
  providerTypeFilter: 'all',
  rulesSearch: '',
  rulesTypeFilter: 'all',
  local: null,
  catalog: [],
  catalogMap: {},
  catalogLoading: false,
  catalogSyncError: null,
  catalogLoadedAt: '',
  catalogWarning: '',
  searchQuery: '',
  categoryFilter: 'all',
  selectedCategories: new Set(),
  selectedBehaviors: new Set(),
  page: 1,
  pageSize: 50,
};

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const border = {
    success: 'border-emerald-800/60 bg-zinc-900 text-zinc-200',
    error: 'border-red-800/60 bg-zinc-900 text-zinc-200',
    info: 'border-zinc-800 bg-zinc-900 text-zinc-200',
    warning: 'border-amber-800/60 bg-zinc-900 text-zinc-200',
  }[type] || 'border-zinc-800 bg-zinc-900 text-zinc-200';

  const dot = {
    success: 'bg-emerald-500',
    error: 'bg-red-500',
    info: 'bg-zinc-400',
    warning: 'bg-amber-500',
  }[type] || 'bg-zinc-400';

  toast.className = `toast-slide border rounded-md p-3 text-xs shadow-lg flex items-center gap-2.5 pointer-events-auto w-full ${border}`;
  toast.innerHTML = `
    <span class="w-2 h-2 rounded-full ${dot} flex-shrink-0"></span>
    <div class="flex-1">${escapeHtml(message)}</div>
    <button class="text-zinc-500 hover:text-zinc-300 text-sm leading-none">&times;</button>
  `;
  toast.querySelector('button').onclick = () => toast.remove();
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3500);
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function setTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `tab-btn pb-2.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-2 ${
      active
        ? 'border-zinc-100 text-zinc-100 font-semibold'
        : 'border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700'
    }`;
  });
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

async function fetchLocal() {
  try {
    const data = await API.getLocal();
    state.local = data;
    updateStats();
  } catch (err) {
    showToast('Failed to load local config: ' + err.message, 'error');
  }
}

function renderCatalogSyncButton() {
  const isLoading = state.catalogLoading;
  const isError = !!state.catalogSyncError;

  let btnClasses = 'h-8 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out ';
  let labelClasses = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 ';
  let dotClasses = 'w-1.5 h-1.5 rounded-full flex-shrink-0 ';
  let iconClasses = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 ';
  let labelText = '';
  let title = 'Refresh catalog';

  if (isError) {
    btnClasses += 'px-2.5 border-red-500/40 bg-red-500/10 text-red-300 hover:bg-red-500/20 hover:border-red-500/60 cursor-pointer';
    labelClasses += 'max-w-[110px] opacity-100 mr-1.5';
    dotClasses += 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
    iconClasses += 'text-red-400';
    labelText = 'Sync failed';
    title = `Sync failed: ${state.catalogSyncError}. Click to retry`;
  } else if (isLoading) {
    btnClasses += 'px-2.5 border-sky-500/40 bg-sky-500/10 text-sky-300 cursor-wait';
    labelClasses += 'max-w-[95px] opacity-100 mr-1.5';
    dotClasses += 'bg-sky-400 animate-pulse';
    iconClasses += 'spin text-sky-400';
    labelText = 'Syncing...';
    title = 'Syncing rulesets...';
  } else {
    btnClasses += 'w-8 px-0 border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 cursor-pointer';
    labelClasses += 'max-w-0 opacity-0 pointer-events-none mr-0';
  }

  return `
    <button id="cat-refresh-btn" type="button" title="${escapeHtml(title)}" class="${btnClasses}">
      <span id="cat-sync-label" class="${labelClasses}">
        <span id="cat-sync-dot" class="${dotClasses}"></span>
        <span id="cat-sync-text" class="font-mono text-[11px]">${labelText}</span>
      </span>
      <svg id="cat-refresh-icon" class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </button>
  `;
}

function updateCatalogSyncStatusUI() {
  const btn = document.getElementById('cat-refresh-btn');
  const label = document.getElementById('cat-sync-label');
  const dot = document.getElementById('cat-sync-dot');
  const txt = document.getElementById('cat-sync-text');
  const icon = document.getElementById('cat-refresh-icon');

  if (!btn || !label || !dot || !txt || !icon) {
    const wrap = document.getElementById('cat-sync-wrapper');
    if (wrap) {
      wrap.innerHTML = renderCatalogSyncButton();
      const newBtn = document.getElementById('cat-refresh-btn');
      if (newBtn) newBtn.addEventListener('click', () => fetchCatalog(true));
    }
    return;
  }

  const isLoading = state.catalogLoading;
  const isError = !!state.catalogSyncError;

  if (isError) {
    btn.className = 'h-8 px-2.5 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-red-500/40 bg-red-500/10 text-red-300 hover:bg-red-500/20 hover:border-red-500/60 cursor-pointer';
    btn.title = `Sync failed: ${state.catalogSyncError}. Click to retry`;
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-[110px] opacity-100 mr-1.5';
    dot.className = 'w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)] flex-shrink-0';
    txt.textContent = 'Sync failed';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 text-red-400';
  } else if (isLoading) {
    btn.className = 'h-8 px-2.5 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-sky-500/40 bg-sky-500/10 text-sky-300 cursor-wait';
    btn.title = 'Syncing rulesets...';
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-[95px] opacity-100 mr-1.5';
    dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse flex-shrink-0';
    txt.textContent = 'Syncing...';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200 spin text-sky-400';
  } else {
    btn.className = 'h-8 w-8 px-0 flex items-center justify-center rounded-md border text-xs font-medium shadow-sm transition-all duration-300 ease-out border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 cursor-pointer';
    btn.title = 'Refresh catalog';
    label.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out flex items-center gap-1.5 max-w-0 opacity-0 pointer-events-none mr-0';
    icon.className = 'w-3.5 h-3.5 flex-shrink-0 transition-colors duration-200';
  }
}

async function fetchCatalog(refresh = false) {
  state.catalogLoading = true;
  state.catalogSyncError = null;
  updateCatalogSyncStatusUI();
  if (state.currentTab === 'catalog') {
    const refreshIcon = document.getElementById('cat-refresh-icon');
    if (refreshIcon) refreshIcon.classList.add('spin');
    updateCatalogTable();
  }
  try {
    const res = await API.getCatalog(refresh);
    state.catalog = res.items || [];
    state.catalogMap = {};
    for (let i = 0; i < state.catalog.length; i++) {
      const it = state.catalog[i];
      state.catalogMap[it.path] = it;
      if (!state.catalogMap[it.name]) state.catalogMap[it.name] = it;
    }
    state.catalogLoadedAt = res.loaded_at || '';
    state.catalogWarning = res.warning || '';
    state.catalogSyncError = null;
  } catch (err) {
    state.catalogSyncError = err.message || 'Sync failed';
    showToast('Catalog load error: ' + err.message, 'error');
  } finally {
    state.catalogLoading = false;
    const refreshIcon = document.getElementById('cat-refresh-icon');
    if (refreshIcon) refreshIcon.classList.remove('spin');
    updateCatalogSyncStatusUI();
    if (state.currentTab === 'catalog') {
      updateFilterCounts();
      updateCatalogHeaderFilters();
      updateCatalogTable();
    } else {
      render();
    }
  }
}

function updateGlobalQuicUI() {
  const isBlocked = state.local && !!state.local.global_quic_blocked;
  const btn = document.getElementById('btn-toggle-quic');
  const dot = document.getElementById('global-quic-indicator');
  const txt = document.getElementById('global-quic-text');
  if (!btn || !dot || !txt) return;

  if (isBlocked) {
    dot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)]';
    btn.className = 'h-8 px-3 text-xs font-medium border border-amber-500/40 bg-amber-500/10 text-amber-200 hover:bg-amber-500/20 rounded-md transition-all flex items-center gap-2 shadow-sm';
    txt.textContent = 'Block All QUIC: ON';
  } else {
    dot.className = 'w-2 h-2 rounded-full bg-zinc-600';
    btn.className = 'h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 rounded-md transition-all flex items-center gap-2 shadow-sm';
    txt.textContent = 'Block All QUIC: OFF';
  }
}

async function pingMihomoStatus() {
  const icon = document.getElementById('stat-mihomo-ping-icon');
  const dot = document.getElementById('stat-mihomo-dot');
  if (icon) icon.classList.add('spin');
  if (dot) dot.className = 'w-2 h-2 rounded-full bg-zinc-500 animate-pulse flex-shrink-0';

  try {
    const status = await API.getMihomoStatus();
    renderMihomoStatus(status);
  } catch (err) {
    renderMihomoStatus({ alive: false, error: 'Unreachable' });
  } finally {
    if (icon) icon.classList.remove('spin');
  }
}

function renderMihomoStatus(status) {
  const dot = document.getElementById('stat-mihomo-dot');
  const txt = document.getElementById('stat-mihomo-status');
  const ver = document.getElementById('stat-mihomo-version');
  const card = document.getElementById('card-mihomo-status');
  if (!dot || !txt || !card || !ver) return;

  if (status && status.alive) {
    card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs cursor-pointer hover:border-zinc-700 transition-all duration-300 ease-out select-none group shadow-sm';
    dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)] flex-shrink-0 transition-colors duration-200';
    txt.className = 'text-xs font-medium text-zinc-200 transition-colors duration-200 whitespace-nowrap';
    txt.textContent = 'Active';

    if (status.version && status.version !== 'Connected') {
      ver.textContent = status.version;
      ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-[80px] opacity-100 px-1.5 py-0.2 rounded bg-zinc-800/90 text-zinc-300 border border-zinc-700/60 font-mono text-[10px] leading-tight flex items-center justify-center';
    } else {
      ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 px-0 py-0 border-transparent text-[10px] font-mono leading-tight';
    }

    const cfgPath = (state.local && state.local.config_path) || '';
    card.title = `Mihomo is online${status.version ? ' (' + status.version + ')' : ''}${cfgPath ? '\nConfig: ' + cfgPath : ''}\nClick to ping`;
  } else {
    const isUnauth = status && status.error && status.error.toLowerCase().includes('unauthorized');
    if (isUnauth) {
      card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/40 text-xs cursor-pointer hover:border-amber-500/60 transition-all duration-300 ease-out select-none group shadow-sm';
      dot.className = 'w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.6)] flex-shrink-0 transition-colors duration-200';
      txt.className = 'text-xs font-medium text-amber-300 transition-colors duration-200 whitespace-nowrap';
      txt.textContent = 'Unauthorized';
    } else {
      card.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full bg-red-500/10 border border-red-500/40 text-xs cursor-pointer hover:border-red-500/60 transition-all duration-300 ease-out select-none group shadow-sm';
      dot.className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)] flex-shrink-0 transition-colors duration-200';
      txt.className = 'text-xs font-medium text-red-300 transition-colors duration-200 whitespace-nowrap';
      txt.textContent = 'Unreachable';
    }

    ver.className = 'overflow-hidden whitespace-nowrap transition-all duration-300 ease-out max-w-0 opacity-0 px-0 py-0 border-transparent text-[10px] font-mono leading-tight';

    const errMsg = (status && status.error) ? status.error : 'Connection refused';
    card.title = `Mihomo status: ${errMsg}\nClick to retry ping`;
  }
}

function updateStats() {
  if (!state.local) return;
  const settingsBadge = document.getElementById('tab-count-settings');
  if (settingsBadge) {
    const totalItems = (state.local.proxy_group_entries || []).length +
                       (state.local.proxy_providers || []).length +
                       (state.local.rules || []).length;
    settingsBadge.textContent = totalItems;
    settingsBadge.classList.remove('hidden');
  }

  if (state.local.mihomo_status) {
    renderMihomoStatus(state.local.mihomo_status);
  }
  updateGlobalQuicUI();
}

function render() {
  const content = document.getElementById('tab-content');
  if (state.currentTab === 'catalog') {
    content.innerHTML = renderCatalogView();
    bindCatalogEvents();
  } else if (state.currentTab === 'settings') {
    content.innerHTML = renderSettingsView();
    bindSettingsEvents();
  }
}

function getFilteredCatalog() {
  const q = state.searchQuery.trim().toLowerCase();
  const activeOnly = state.categoryFilter === 'applied';

  return state.catalog.filter(item => {
    if (activeOnly && !item.applied) return false;
    if (state.selectedCategories.size > 0 && !state.selectedCategories.has(item.category)) return false;
    if (state.selectedBehaviors.size > 0 && !state.selectedBehaviors.has(item.behavior)) return false;
    if (q && !item.name.toLowerCase().includes(q) && !item.path.toLowerCase().includes(q)) return false;
    return true;
  });
}

function getCatalogCategories() {
  const map = {};
  for (let i = 0; i < state.catalog.length; i++) {
    const c = state.catalog[i].category || 'other';
    map[c] = (map[c] || 0) + 1;
  }
  return Object.keys(map).sort().map(k => ({ name: k, count: map[k] }));
}

function getCatalogBehaviors() {
  const map = {};
  for (let i = 0; i < state.catalog.length; i++) {
    const b = state.catalog[i].behavior || 'other';
    map[b] = (map[b] || 0) + 1;
  }
  return Object.keys(map).sort().map(k => ({ name: k, count: map[k] }));
}

function updateCatalogTable() {
  const tbody = document.getElementById('cat-tbody');
  const pag = document.getElementById('cat-pagination');
  if (!tbody) return;

  if (state.catalogLoading && state.catalog.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="py-12 text-center text-zinc-500 font-mono">
          <div class="w-5 h-5 border-2 border-zinc-400 border-t-transparent rounded-full spin mx-auto mb-2"></div>
          Synchronizing catalog tree...
        </td>
      </tr>
    `;
    if (pag) pag.innerHTML = '';
    return;
  }

  const filtered = getFilteredCatalog();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;

  if (total === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="py-12 text-center text-zinc-500">
          No matching rulesets found in catalog.
        </td>
      </tr>
    `;
    if (pag) {
      pag.innerHTML = `<div class="text-[11px] text-zinc-500 font-mono">0 of ${state.catalog.length} rulesets</div>`;
    }
    return;
  }

  const startIdx = (state.page - 1) * state.pageSize;
  const endIdx = Math.min(startIdx + state.pageSize, total);
  const pageItems = filtered.slice(startIdx, endIdx);

  let rowsHtml = '';
  for (let i = 0; i < pageItems.length; i++) {
    const item = pageItems[i];
    rowsHtml += `
      <tr class="hover:bg-zinc-900/50 transition-colors ${item.applied ? 'bg-zinc-900/20' : ''}">
        <td class="py-2.5 px-4 font-mono">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-zinc-200">${escapeHtml(item.name)}</span>
            ${item.applied ? `
              <span class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-400 font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Active${item.applied_name && item.applied_name.toLowerCase() !== item.name.toLowerCase() ? ` (${escapeHtml(item.applied_name)})` : ''}
              </span>
            ` : ''}
            ${item.downloaded ? (
              item.has_diff ? `
                <span class="inline-flex items-center gap-1 text-[10px] font-medium text-amber-400 font-mono px-1.5 py-0.2 rounded bg-amber-500/10 border border-amber-500/20" title="Local file size (${formatBytes(item.disk_size)}) differs from repository (${formatBytes(item.size)})">
                  <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Downloaded (diff)
                </span>
              ` : `
                <span class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-400 font-mono px-1.5 py-0.2 rounded bg-emerald-500/10 border border-emerald-500/20" title="Downloaded (${formatBytes(item.disk_size || item.size)})">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Downloaded
                </span>
              `
            ) : ''}
            ${item.block_quic ? `
              <span class="inline-flex items-center text-[9px] font-mono px-1 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">QUIC</span>
            ` : ''}
          </div>
          <div class="text-[11px] text-zinc-500 font-mono truncate max-w-xs sm:max-w-sm">${escapeHtml(item.path)}</div>
        </td>
        <td class="py-2.5 px-4">
          <span class="inline-flex items-center text-[10px] font-mono px-2 py-0.5 rounded border ${
            item.category === 'geosite'
              ? 'bg-sky-500/10 text-sky-400 border-sky-500/20'
              : 'bg-purple-500/10 text-purple-400 border-purple-500/20'
          }">${escapeHtml(item.category)}</span>
        </td>
        <td class="py-2.5 px-4 font-mono text-zinc-400">${escapeHtml(item.behavior)}</td>
        <td class="py-2.5 px-4 font-mono text-zinc-400">${formatBytes(item.size)}</td>
        <td class="py-2.5 px-4 text-right whitespace-nowrap">
          <button data-preview-rule="${escapeHtml(item.name)}" data-preview-url="${escapeHtml(item.url)}" title="Preview ruleset contents" class="h-7 px-2 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-100 rounded border border-zinc-800 transition-colors mr-1 inline-flex items-center gap-1">
            <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            View
          </button>
          ${item.applied ? `
            <button data-edit-rule="${escapeHtml(item.applied_name || item.name)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded border border-zinc-700 transition-colors mr-1">
              Edit
            </button>
            <button data-remove-name="${escapeHtml(item.applied_name || item.name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
              Remove
            </button>
          ` : `
            <button data-add-path="${escapeHtml(item.path)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded transition-colors shadow-sm font-semibold">
              Add Rule
            </button>
          `}
        </td>
      </tr>
    `;
  }
  tbody.innerHTML = rowsHtml;

  if (pag) {
    pag.innerHTML = `
      <div class="text-[11px] text-zinc-500 font-mono">
        Showing <span class="text-zinc-300 font-semibold">${startIdx + 1}</span>–<span class="text-zinc-300 font-semibold">${endIdx}</span> of <span class="text-zinc-300 font-semibold">${total}</span> rulesets
        ${state.catalog.length !== total ? `<span class="text-zinc-600">(filtered from ${state.catalog.length})</span>` : ''}
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] text-zinc-500 font-mono">Per page:</span>
          <select id="cat-pagesize-select" class="h-7 px-2 bg-zinc-900 border border-zinc-800 rounded text-[11px] text-zinc-200 font-mono focus:outline-none focus:border-zinc-500">
            <option value="25" ${state.pageSize === 25 ? 'selected' : ''}>25</option>
            <option value="50" ${state.pageSize === 50 ? 'selected' : ''}>50</option>
            <option value="100" ${state.pageSize === 100 ? 'selected' : ''}>100</option>
            <option value="200" ${state.pageSize === 200 ? 'selected' : ''}>200</option>
          </select>
        </div>

        <div class="flex items-center gap-1">
          <button id="cat-page-first" ${state.page <= 1 ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            «
          </button>
          <button id="cat-page-prev" ${state.page <= 1 ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            ‹ Prev
          </button>

          <span class="px-2 text-[11px] font-mono text-zinc-400">
            Page <span class="text-zinc-100 font-semibold">${state.page}</span> / <span class="text-zinc-400">${totalPages}</span>
          </span>

          <button id="cat-page-next" ${state.page >= totalPages ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2.5 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            Next ›
          </button>
          <button id="cat-page-last" ${state.page >= totalPages ? 'disabled class="opacity-30 cursor-not-allowed h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-500"' : 'class="h-7 px-2 text-xs font-medium rounded border border-zinc-800 bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition-colors"'}>
            »
          </button>
        </div>
      </div>
    `;

    const prevBtn = document.getElementById('cat-page-prev');
    if (prevBtn && state.page > 1) {
      prevBtn.onclick = () => { state.page--; updateCatalogTable(); };
    }
    const nextBtn = document.getElementById('cat-page-next');
    if (nextBtn && state.page < totalPages) {
      nextBtn.onclick = () => { state.page++; updateCatalogTable(); };
    }
    const firstBtn = document.getElementById('cat-page-first');
    if (firstBtn && state.page > 1) {
      firstBtn.onclick = () => { state.page = 1; updateCatalogTable(); };
    }
    const lastBtn = document.getElementById('cat-page-last');
    if (lastBtn && state.page < totalPages) {
      lastBtn.onclick = () => { state.page = totalPages; updateCatalogTable(); };
    }
    const sizeSelect = document.getElementById('cat-pagesize-select');
    if (sizeSelect) {
      sizeSelect.onchange = (e) => {
        state.pageSize = parseInt(e.target.value, 10) || 50;
        state.page = 1;
        updateCatalogTable();
      };
    }
  }
}

function bindCatalogEvents() {
  const searchInput = document.getElementById('cat-search');
  if (searchInput) {
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.searchQuery = e.target.value;
        state.page = 1;
        updateCatalogTable();
      }, 70);
    });
  }

  document.querySelectorAll('[data-cat-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.categoryFilter = btn.dataset.catFilter;
      state.page = 1;
      document.querySelectorAll('[data-cat-filter]').forEach(b => {
        const active = b.dataset.catFilter === state.categoryFilter;
        b.className = `h-8 px-3 text-xs font-medium rounded-md border transition-colors ${
          active ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'
        }`;
      });
      updateCatalogTable();
    });
  });

  const refBtn = document.getElementById('cat-refresh-btn');
  if (refBtn) {
    refBtn.addEventListener('click', () => fetchCatalog(true));
  }

  const tbody = document.getElementById('cat-tbody');
  if (tbody) {
    tbody.addEventListener('click', (e) => {
      const previewBtn = e.target.closest('[data-preview-rule]');
      if (previewBtn) {
        openPreviewModal(previewBtn.dataset.previewRule, previewBtn.dataset.previewUrl);
        return;
      }
      const editBtn = e.target.closest('[data-edit-rule]');
      if (editBtn) {
        openEditRuleModal(editBtn.dataset.editRule);
        return;
      }
      const addBtn = e.target.closest('[data-add-path]');
      if (addBtn) {
        const item = state.catalogMap[addBtn.dataset.addPath];
        if (item) openAddRuleModal(item);
        return;
      }
      const removeBtn = e.target.closest('[data-remove-name]');
      if (removeBtn) {
        confirmDeleteRule(removeBtn.dataset.removeName);
        return;
      }
    });
  }

  bindFilterDropdowns();
  updateCatalogTable();
}

function updateCatalogHeaderFilters() {
  const thCat = document.getElementById('th-category');
  const thBeh = document.getElementById('th-behavior');
  if (thCat) thCat.innerHTML = renderCategoryFilterHeader();
  if (thBeh) thBeh.innerHTML = renderBehaviorFilterHeader();
  bindFilterDropdowns();
}

function bindFilterDropdowns() {
  const btnCat = document.getElementById('btn-filter-cat');
  const menuCat = document.getElementById('menu-filter-cat');
  const btnBeh = document.getElementById('btn-filter-beh');
  const menuBeh = document.getElementById('menu-filter-beh');

  if (btnCat && menuCat) {
    btnCat.onclick = (e) => {
      e.stopPropagation();
      menuCat.classList.toggle('hidden');
      if (menuBeh) menuBeh.classList.add('hidden');
    };
    menuCat.onclick = (e) => e.stopPropagation();
  }

  if (btnBeh && menuBeh) {
    btnBeh.onclick = (e) => {
      e.stopPropagation();
      menuBeh.classList.toggle('hidden');
      if (menuCat) menuCat.classList.add('hidden');
    };
    menuBeh.onclick = (e) => e.stopPropagation();
  }

  document.querySelectorAll('[data-cat-choice]').forEach(cb => {
    cb.onchange = () => {
      const cat = cb.dataset.catChoice;
      if (cb.checked) {
        state.selectedCategories.add(cat);
      } else {
        state.selectedCategories.delete(cat);
      }
      state.page = 1;
      updateCatalogTable();
      updateCatalogHeaderFilters();
      const m = document.getElementById('menu-filter-cat');
      if (m) m.classList.remove('hidden');
    };
  });

  document.querySelectorAll('[data-beh-choice]').forEach(cb => {
    cb.onchange = () => {
      const beh = cb.dataset.behChoice;
      if (cb.checked) {
        state.selectedBehaviors.add(beh);

function parseMihomoRule(rule) {
  const raw = (rule || '').trim();
  if (!raw) return { raw: '', type: '', payload: '', target: '', noResolve: false };

  if (raw.toUpperCase().startsWith('MATCH,')) {
    const parts = raw.split(',');
    return { raw, type: 'MATCH', payload: '', target: (parts[1] || '').trim(), noResolve: false };
  }

  if (raw.startsWith('AND,') || raw.startsWith('OR,') || raw.startsWith('NOT,')) {
    const firstComma = raw.indexOf(',');
    const lastComma = raw.lastIndexOf(',');
    if (lastComma > firstComma) {
      return {
        raw,
        type: raw.substring(0, firstComma).trim(),
        payload: raw.substring(firstComma + 1, lastComma).trim(),
        target: raw.substring(lastComma + 1).trim(),
        noResolve: false,
      };
    }
  }

  const parts = raw.split(',').map(s => s.trim());
  const type = parts[0] || '';
  const payload = parts[1] || '';
  const target = parts[2] || '';
  const noResolve = parts.slice(3).some(p => p.toLowerCase() === 'no-resolve');

  return { raw, type, payload, target, noResolve };
}

function getGroupTypeBadge(type) {
  const t = (type || 'select').toLowerCase();
  const colors = {
    'select': 'bg-sky-500/10 text-sky-400 border-sky-500/20',
    'url-test': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
    'fallback': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
    'load-balance': 'bg-purple-500/10 text-purple-400 border-purple-500/20',
    'relay': 'bg-pink-500/10 text-pink-400 border-pink-500/20',
  };
  const cls = colors[t] || 'bg-zinc-800 text-zinc-300 border-zinc-700';
  return `<span class="inline-flex items-center text-[10px] font-mono px-2 py-0.5 rounded border ${cls} font-medium uppercase">${escapeHtml(t)}</span>`;
}

function getRuleTypeBadge(type) {
  const t = (type || '').toUpperCase();
  let cls = 'bg-zinc-800 text-zinc-300 border-zinc-700';
  if (t === 'RULE-SET') cls = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
  else if (t.startsWith('DOMAIN')) cls = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
  else if (t.startsWith('IP-CIDR') || t === 'GEOIP' || t === 'GEOSITE') cls = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
  else if (t === 'MATCH') cls = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
  else if (t === 'AND' || t === 'OR' || t === 'NOT') cls = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
  else if (t.includes('PORT')) cls = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
  return `<span class="inline-flex items-center text-[10px] font-mono px-2 py-0.5 rounded border ${cls} font-medium uppercase">${escapeHtml(t || 'RULE')}</span>`;
}

function getTargetBadge(target) {
  const t = (target || '').toUpperCase();
  let cls = 'bg-zinc-800 text-zinc-200 border-zinc-700';
  if (t === 'DIRECT') cls = 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20';
  else if (t === 'REJECT') cls = 'bg-red-500/10 text-red-400 border-red-500/20';
  else if (t === 'GLOBAL') cls = 'bg-amber-500/10 text-amber-300 border-amber-500/20';
  else if (t === 'PROXY' || t === 'UNBLOCK') cls = 'bg-sky-500/10 text-sky-300 border-sky-500/20';
  return `<span class="inline-flex items-center text-[11px] font-mono px-2 py-0.5 rounded border ${cls} font-semibold">${escapeHtml(target)}</span>`;
}

function renderSettingsRules(s) {
  const q = (state.rulesSearch || '').toLowerCase().trim();
  const tf = (state.rulesTypeFilter || 'all').toUpperCase();

  const allRules = s.rules || [];
  const parsedRules = allRules.map((r, originalIdx) => {
    const parsed = parseMihomoRule(r);
    return { ...parsed, originalIdx };
  });

  const filtered = parsedRules.filter(item => {
    if (tf !== 'ALL') {
      if (tf === 'OTHER') {
        const standardTypes = ['RULE-SET', 'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'IP-CIDR', 'IP-CIDR6', 'GEOIP', 'GEOSITE', 'MATCH'];
        if (standardTypes.includes(item.type.toUpperCase())) return false;
      } else if (item.type.toUpperCase() !== tf) {
        return false;
      }
    }
    if (q) {
      const matchRaw = item.raw.toLowerCase().includes(q);
      const matchPayload = item.payload.toLowerCase().includes(q);
      const matchTarget = item.target.toLowerCase().includes(q);
      if (!matchRaw && !matchPayload && !matchTarget) return false;
    }
    return true;
  });

  const typeOptions = ['ALL', 'RULE-SET', 'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'IP-CIDR', 'GEOIP', 'MATCH', 'OTHER'];

  return `
    <div class="space-y-4 w-full">
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between w-full">
        <div class="relative w-full sm:w-72">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-zinc-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="input-rules-search" type="text" value="${escapeHtml(state.rulesSearch)}" placeholder="Search rules by payload, target..." class="h-9 w-full pl-9 pr-3 bg-zinc-900 border border-zinc-800 rounded-md text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 font-mono">
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <div class="flex items-center gap-1">
            <span class="text-[11px] font-mono text-zinc-500">Type:</span>
            <select id="select-rules-type" class="h-8 px-2 bg-zinc-900 border border-zinc-800 rounded-md text-xs text-zinc-200 font-mono focus:outline-none focus:border-zinc-500">
              ${typeOptions.map(t => `<option value="${t}" ${tf === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
          </div>
          <button id="btn-add-raw-rule" class="h-8 px-3 text-xs font-semibold bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded-md transition-colors shadow-sm flex items-center gap-1.5 ml-auto">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Add Rule
          </button>
        </div>
      </div>

      <div class="rounded-md border border-zinc-800 bg-zinc-900/30 overflow-hidden w-full">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-zinc-900/80 text-[11px] font-medium text-zinc-400">
              <th class="py-2.5 px-3 w-16 text-center">Order</th>
              <th class="py-2.5 px-4 w-36">Rule Type</th>
              <th class="py-2.5 px-4">Payload / Criteria</th>
              <th class="py-2.5 px-4">Target Proxy Group</th>
              <th class="py-2.5 px-4">Flags</th>
              <th class="py-2.5 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-zinc-800/60 text-xs">
            ${filtered.length === 0 ? `
              <tr>
                <td colspan="6" class="py-12 text-center text-zinc-500 font-mono">
                  ${allRules.length === 0 ? 'No rules found in config.yaml' : 'No rules match the filter criteria'}
                </td>
              </tr>
            ` : filtered.map((item) => {
              const idx = item.originalIdx;
              const isFirst = idx === 0;
              const isLast = idx === allRules.length - 1;
              return `
                <tr class="hover:bg-zinc-900/50 transition-colors ${item.type === 'MATCH' ? 'bg-amber-500/5' : ''}">
                  <td class="py-2.5 px-3 font-mono text-zinc-500 text-center">
                    <div class="flex items-center justify-center gap-1">
                      <span class="w-6 text-right font-semibold text-zinc-400">${idx + 1}</span>
                      <div class="flex flex-col">
                        <button data-rule-up="${idx}" ${isFirst ? 'disabled class="opacity-20 cursor-not-allowed text-zinc-600"' : 'class="hover:text-zinc-200 text-zinc-500 transition-colors" title="Move rule up"'} >▲</button>
                        <button data-rule-down="${idx}" ${isLast ? 'disabled class="opacity-20 cursor-not-allowed text-zinc-600"' : 'class="hover:text-zinc-200 text-zinc-500 transition-colors" title="Move rule down"'} >▼</button>
                      </div>
                    </div>
                  </td>
                  <td class="py-2.5 px-4">
                    ${getRuleTypeBadge(item.type)}
                  </td>
                  <td class="py-2.5 px-4 font-mono">
                    <span class="text-zinc-200 break-all">${escapeHtml(item.payload || (item.type === 'MATCH' ? 'Match-All Outbound Traffic' : ''))}</span>
                  </td>
                  <td class="py-2.5 px-4">
                    ${getTargetBadge(item.target)}
                  </td>
                  <td class="py-2.5 px-4 font-mono">
                    ${item.noResolve ? `
                      <span class="inline-flex items-center text-[10px] font-mono px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">no-resolve</span>
                    ` : `<span class="text-zinc-600">-</span>`}
                  </td>
                  <td class="py-2.5 px-4 text-right whitespace-nowrap">
                    <button data-edit-raw-rule="${idx}" class="h-7 px-2.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded border border-zinc-700 transition-colors mr-1">Edit</button>
                    <button data-delete-raw-rule="${idx}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">Delete</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function bindSettingsRulesEvents() {
  const searchInput = document.getElementById('input-rules-search');
  if (searchInput) {
    let timer;
    searchInput.oninput = (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        state.rulesSearch = e.target.value;
        const subContent = document.getElementById('settings-sub-content');
        if (subContent && state.local) {
          subContent.innerHTML = renderSettingsRules(state.local);
          bindSettingsRulesEvents();
        }
      }, 70);
    };
  }

  const typeSelect = document.getElementById('select-rules-type');
  if (typeSelect) {
    typeSelect.onchange = (e) => {
      state.rulesTypeFilter = e.target.value;
      const subContent = document.getElementById('settings-sub-content');
      if (subContent && state.local) {
        subContent.innerHTML = renderSettingsRules(state.local);
        bindSettingsRulesEvents();
      }
    };
  }

  const addBtn = document.getElementById('btn-add-raw-rule');
  if (addBtn) addBtn.onclick = () => openRawRuleModal(-1);

  document.querySelectorAll('[data-rule-up]').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.ruleUp, 10);
      if (idx > 0) {
        try {
          await API.moveRawRule(idx, idx - 1);
          await fetchLocal();
          render();
        } catch (err) {
          showToast(err.message, 'error');
        }
      }
    };
  });

  document.querySelectorAll('[data-rule-down]').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.ruleDown, 10);
      const total = (state.local && state.local.rules) ? state.local.rules.length : 0;
      if (idx < total - 1) {
        try {
          await API.moveRawRule(idx, idx + 1);
          await fetchLocal();
          render();
        } catch (err) {
          showToast(err.message, 'error');
        }
      }
    };
  });

  document.querySelectorAll('[data-edit-raw-rule]').forEach(btn => {
    btn.onclick = () => openRawRuleModal(parseInt(btn.dataset.editRawRule, 10));

  document.querySelectorAll('[data-delete-raw-rule]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.deleteRawRule, 10);
      const ruleStr = (state.local && state.local.rules) ? state.local.rules[idx] : '';
      confirmDeleteRawRule(idx, ruleStr);
    };
  });
}

function renderSettingsDirectives(s) {
  const rules = (s.rules || []).filter(r => r.trim().startsWith('RULE-SET,'));
  const providersMap = {};
  (s.rule_providers || []).forEach(p => { providersMap[p.name] = p; });

  const diskMap = {};
  (s.disk_files || []).forEach(f => { diskMap[f.name.toLowerCase()] = f; });

  return `
    <div class="space-y-6 w-full">
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-semibold text-zinc-100">Registered Rule Directives</h2>
            <p class="text-xs text-zinc-500">Mihomo traffic matching these sets is forwarded to target proxy groups</p>
          </div>
          <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2.5 py-1 rounded border border-zinc-800">${rules.length} active directives</span>
        </div>

        <div class="rounded-md border border-zinc-800 bg-zinc-900/30 overflow-hidden w-full">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-zinc-800 bg-zinc-900/80 text-[11px] font-medium text-zinc-400">
                <th class="py-2.5 px-4 w-12">#</th>
                <th class="py-2.5 px-4">Provider / Ruleset</th>
                <th class="py-2.5 px-4">Target Group</th>
                <th class="py-2.5 px-4">Behavior</th>
                <th class="py-2.5 px-4">Local Binary (.mrs)</th>
                <th class="py-2.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-zinc-800/60 text-xs">
              ${rules.length === 0 ? `
                <tr>
                  <td colspan="6" class="py-12 text-center text-zinc-500">
                    No active RULE-SET directives in config. Add rules from the Catalog tab or via Custom MRS.
                  </td>
                </tr>
              ` : rules.map((rule, idx) => {
                const parts = rule.split(',').map(str => str.trim());
                const name = parts[1] || '';
                const targetGroup = parts[2] || '';
                const prov = providersMap[name];

                const cleanPURL = prov && prov.url ? prov.url.trim().toLowerCase().replace(/\/+$/, '') : '';
                const catItem = (state.catalog || []).find(c => {
                  if (c.applied_name && c.applied_name.toLowerCase() === name.toLowerCase()) return true;
                  if (c.name.toLowerCase() === name.toLowerCase()) return true;
                  if (cleanPURL && c.url) {
                    const cleanCURL = c.url.trim().toLowerCase().replace(/\/+$/, '');
                    if (cleanPURL === cleanCURL) return true;
                    if (cleanPURL.endsWith('/' + c.path.toLowerCase())) return true;
                    if (cleanPURL.endsWith('/' + c.name.toLowerCase() + '.mrs')) return true;
                  }
                  return false;
                });

                let diskFile = diskMap[(name + '.mrs').toLowerCase()];
                if (!diskFile && prov && prov.path) {
                  const base = prov.path.split(/[\/\\]/).pop().toLowerCase();
                  diskFile = diskMap[base];
                }
                if (!diskFile && prov && prov.url) {
                  const urlBase = prov.url.split('?')[0].split('/').pop().toLowerCase();
                  diskFile = diskMap[urlBase];
                }
                if (!diskFile && catItem) {
                  diskFile = diskMap[(catItem.name + '.mrs').toLowerCase()] || diskMap[catItem.path.split('/').pop().toLowerCase()];
                }

                const isQuic = (s.quic_blocked || []).some(q => q.toLowerCase() === name.toLowerCase());
                const hasDiff = diskFile && catItem && catItem.size > 0 && diskFile.size !== catItem.size;
                const previewUrl = (prov && prov.url) || (catItem && catItem.url) || '';

                return `
                  <tr class="hover:bg-zinc-900/50 transition-colors">
                    <td class="py-2.5 px-4 font-mono text-zinc-500">${idx + 1}</td>
                    <td class="py-2.5 px-4 font-mono">
                      <div class="flex items-center gap-2">
                        <span class="font-semibold text-zinc-100">${escapeHtml(name)}</span>
                        ${isQuic ? `
                          <span class="inline-flex items-center text-[10px] font-mono px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">QUIC Blocked</span>
                        ` : ''}
                      </div>
                      ${prov && prov.url ? `<div class="text-[11px] text-zinc-500 truncate max-w-sm">${escapeHtml(prov.url)}</div>` : ''}
                    </td>
                    <td class="py-2.5 px-4">
                      ${getTargetBadge(targetGroup)}
                    </td>
                    <td class="py-2.5 px-4 font-mono text-zinc-400">
                      ${prov ? escapeHtml(prov.behavior) : 'domain'}
                    </td>
                    <td class="py-2.5 px-4">
                      ${diskFile ? (
                        hasDiff ? `
                          <div class="flex flex-col gap-0.5">
                            <span class="inline-flex items-center gap-1.5 text-[11px] text-amber-400 font-mono">
                              <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                              Downloaded (${formatBytes(diskFile.size)})
                            </span>
                            <span class="inline-flex items-center gap-1 text-[10px] text-amber-300/90 font-mono" title="Repository size: ${formatBytes(catItem.size)}">
                              <span class="px-1 py-0.2 rounded bg-amber-500/10 border border-amber-500/20">diff with repo (${formatBytes(catItem.size)})</span>
                            </span>
                          </div>
                        ` : `
                          <span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-mono">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            Downloaded (${formatBytes(diskFile.size)})
                          </span>
                        `
                      ) : `
                        <span class="inline-flex items-center gap-1.5 text-[11px] text-amber-400 font-mono" title="Mihomo core has not downloaded this ruleset binary to disk yet">
                          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                          Pending Core Download
                        </span>
                      `}
                    </td>
                    <td class="py-2.5 px-4 text-right whitespace-nowrap">
                      <button data-preview-rule="${escapeHtml(name)}" data-preview-url="${escapeHtml(previewUrl)}" title="Preview ruleset contents" class="h-7 px-2 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-100 rounded border border-zinc-800 transition-colors mr-1 inline-flex items-center gap-1">
                        <svg class="w-3 h-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        View
                      </button>
                      <button data-edit-rule="${escapeHtml(name)}" class="h-7 px-2.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded border border-zinc-700 transition-colors mr-1">
                        Edit
                      </button>
                      <button data-delete-rule="${escapeHtml(name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
                        Delete
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="rounded-lg border border-zinc-800 bg-zinc-900/30 p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Files in Rules Folder</h3>
          <span class="text-xs font-mono text-zinc-500">${(s.disk_files || []).length} files</span>
        </div>
        <p class="text-xs text-zinc-500 font-mono truncate">${escapeHtml(s.rules_dir)}</p>
        <div class="max-h-56 overflow-y-auto divide-y divide-zinc-800/60 font-mono text-xs border border-zinc-800 rounded bg-zinc-950/50">
          ${(s.disk_files || []).length === 0 ? `
            <div class="p-3 text-zinc-500 text-center italic">No rules downloaded yet.</div>
          ` : s.disk_files.map(f => `
            <div class="px-3 py-2 flex items-center justify-between">
              <span class="text-zinc-200">${escapeHtml(f.name)}</span>
              <div class="flex items-center gap-2">
                <span class="text-zinc-500">${formatBytes(f.size)} · ${escapeHtml(f.mod_time)}</span>
                <button data-preview-file="${escapeHtml(f.name)}" class="h-6 px-2 text-[11px] font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-zinc-100 rounded border border-zinc-800 transition-colors">View</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function openProxyGroupModal(groupName = null) {
  if (!state.local) return;
  const isEdit = !!groupName;
  const group = isEdit ? (state.local.proxy_group_entries || []).find(g => g.name === groupName) : null;

  const currentType = group ? (group.type || 'select').toLowerCase() : 'select';
  const currentName = group ? group.name : '';
  const currentProxies = new Set(group ? (group.proxies || []) : []);
  const currentUse = new Set(group ? (group.use || []) : []);
  const currentUrl = group ? (group.url || 'https://www.gstatic.com/generate_204') : 'https://www.gstatic.com/generate_204';
  const currentInterval = group && group.interval !== undefined ? group.interval : 300;
  const currentTolerance = group && group.tolerance !== undefined ? group.tolerance : 50;
  const currentStrategy = group ? (group.strategy || 'consistent-hashing') : 'consistent-hashing';
  const currentLazy = group && group.lazy !== undefined ? group.lazy : true;
  const currentDisableUdp = group && group.disable_udp !== undefined ? group.disable_udp : false;
  const currentFilter = group ? (group.filter || '') : '';
  const currentExcludeFilter = group ? (group.exclude_filter || '') : '';

  const discovered = state.local.discovered_proxies || ['DIRECT', 'REJECT', 'GLOBAL'];
  const allProviders = state.local.proxy_providers || [];

  const modal = document.getElementById('modal-container');

  const renderDynamicFields = (t) => {
    if (t === 'url-test' || t === 'fallback') {
      return `
        <div class="grid grid-cols-2 gap-3">
          <div class="col-span-2">
            <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Health Check Test URL</label>
            <input id="modal-group-url" type="text" value="${escapeHtml(currentUrl)}" class="h-8 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none text-xs">
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Interval (seconds)</label>
            <input id="modal-group-interval" type="number" value="${currentInterval}" min="1" class="h-8 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none text-xs">
          </div>
          ${t === 'url-test' ? `
            <div>
              <label class="block text-zinc-400 mb-1 font-mono text-[11px]">Tolerance (ms)</label>
              <input id="modal-group-tolerance" type="number" value="${currentTolerance}" min="0" class="h-8 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none text-xs">

  };

  document.getElementById('modal-group-close').onclick = closeModal;
  document.getElementById('modal-group-cancel').onclick = closeModal;
  modal.onclick = closeModal;

  const typeSelect = document.getElementById('modal-group-type');
  typeSelect.onchange = (e) => {
    const dynContainer = document.getElementById('modal-dynamic-container');
    if (dynContainer) {

    }
  };

  document.getElementById('modal-group-save').onclick = async () => {
    const name = document.getElementById('modal-group-name').value.trim();
    if (!name) {
      showToast('Proxy group name is required', 'error');
      return;
    }
    const t = typeSelect.value;
    const selectedProxies = [];
    document.querySelectorAll('[data-proxy-chk]:checked').forEach(cb => {
      selectedProxies.push(cb.dataset.proxyChk);
    });

    const selectedUse = [];
    document.querySelectorAll('[data-prov-chk]:checked').forEach(cb => {
      selectedUse.push(cb.dataset.provChk);
    });

    if (selectedProxies.length === 0 && selectedUse.length === 0) {
      showToast('At least one proxy or proxy-provider must be selected', 'warning');
      return;
    }

    const payload = {
      name,
      type: t,
      proxies: selectedProxies,
    };
    if (selectedUse.length > 0) payload.use = selectedUse;

    const urlInput = document.getElementById('modal-group-url');
    if (urlInput && urlInput.value.trim()) payload.url = urlInput.value.trim();

    const intervalInput = document.getElementById('modal-group-interval');
    if (intervalInput && intervalInput.value) payload.interval = parseInt(intervalInput.value, 10);

    const toleranceInput = document.getElementById('modal-group-tolerance');
    if (toleranceInput && toleranceInput.value) payload.tolerance = parseInt(toleranceInput.value, 10);

    const stratSelect = document.getElementById('modal-group-strategy');
    if (stratSelect) payload.strategy = stratSelect.value;

    const lazyChk = document.getElementById('modal-group-lazy');
    if (lazyChk) payload.lazy = lazyChk.checked;

    const udpChk = document.getElementById('modal-group-disable-udp');
    if (udpChk) payload.disable_udp = udpChk.checked;

    const filterInput = document.getElementById('modal-group-filter');
    if (filterInput && filterInput.value.trim()) payload.filter = filterInput.value.trim();

    const exclInput = document.getElementById('modal-group-exclude');
    if (exclInput && exclInput.value.trim()) payload.exclude_filter = exclInput.value.trim();

    const saveBtn = document.getElementById('modal-group-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      if (isEdit) {
        payload.old_name = groupName;
        await API.editProxyGroup(payload);
        showToast(`Proxy group "${name}" updated`, 'success');
      } else {
        await API.addProxyGroup(payload);
        showToast(`Proxy group "${name}" created`, 'success');
      }
      closeModal();
      await fetchLocal();
      render();
    } catch (err) {
      showToast(err.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save & Reload';
    }
  };
}

  const hcEnableChk = document.getElementById('modal-prov-hc-enable');
  hcEnableChk.onchange = (e) => {
    const hcBody = document.getElementById('modal-prov-hc-body');
    if (hcBody) {
      if (e.target.checked) hcBody.classList.remove('hidden');
      else hcBody.classList.add('hidden');
    }
  };

  document.getElementById('modal-prov-save').onclick = async () => {
    const name = document.getElementById('modal-prov-name').value.trim();
    if (!name) {
      showToast('Proxy provider name is required', 'error');
      return;
    }
    const t = typeSelect.value;
    const url = document.getElementById('modal-prov-url').value.trim();
    const path = document.getElementById('modal-prov-path').value.trim();
    const interval = parseInt(document.getElementById('modal-prov-interval').value, 10) || 0;
    const proxy = document.getElementById('modal-prov-proxy').value;
    const filter = document.getElementById('modal-prov-filter').value.trim();
    const excludeFilter = document.getElementById('modal-prov-exclude-filter').value.trim();
    const excludeType = document.getElementById('modal-prov-exclude-type').value.trim();

    const isHc = document.getElementById('modal-prov-hc-enable').checked;
    let healthCheck = null;
    if (isHc) {
      healthCheck = {
        enable: true,
        url: document.getElementById('modal-prov-hc-url').value.trim() || 'https://www.gstatic.com/generate_204',
        interval: parseInt(document.getElementById('modal-prov-hc-interval').value, 10) || 300,
        timeout: parseInt(document.getElementById('modal-prov-hc-timeout').value, 10) || 5000,
        lazy: document.getElementById('modal-prov-hc-lazy').checked,
      };
      const expStatus = document.getElementById('modal-prov-hc-status').value.trim();
      if (expStatus) healthCheck.expected_status = parseInt(expStatus, 10);
    }

    const payload = {
      name,
      type: t,
      path,
      interval,
    };
    if (t === 'http' && url) payload.url = url;
    if (proxy) payload.proxy = proxy;
    if (filter) payload.filter = filter;
    if (excludeFilter) payload.exclude_filter = excludeFilter;
    if (excludeType) payload.exclude_type = excludeType;
    if (healthCheck) payload.health_check = healthCheck;

    const saveBtn = document.getElementById('modal-prov-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      if (isEdit) {
        payload.old_name = provName;
        await API.editProxyProvider(payload);
        showToast(`Proxy provider "${name}" updated`, 'success');
      } else {
        await API.addProxyProvider(payload);
        showToast(`Proxy provider "${name}" created`, 'success');
      }
      closeModal();
      await fetchLocal();
      render();
    } catch (err) {
      showToast(err.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save & Reload';
    }
  };
}

function openRawRuleModal(index = -1) {

        </div>
        <button id="modal-rule-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div class="flex items-center gap-1 bg-zinc-900/60 p-0.5 rounded-md border border-zinc-800 text-xs">

        <button id="modal-tab-raw" class="flex-1 py-1 px-2 rounded font-medium transition-colors text-zinc-400 hover:text-zinc-200">Raw YAML String</button>
      </div>

              ${ruleTypes.map(t => `<option value="${t}" ${t === initialType ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-zinc-300 mb-1 font-medium">Target Proxy Group</label>
            <select id="modal-rule-target" class="h-9 w-full px-2.5 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 focus:border-zinc-500 focus:outline-none font-medium font-mono text-xs">
              ${allTargets.map(t => `<option value="${escapeHtml(t)}" ${t === initialTarget ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div id="modal-rule-payload-wrap" class="${initialType === 'MATCH' ? 'hidden' : ''}">
          <label class="block text-zinc-300 mb-1 font-medium">Payload / Match Criteria</label>

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };
  document.getElementById('modal-rule-close').onclick = closeModal;
  document.getElementById('modal-rule-cancel').onclick = closeModal;
  modal.onclick = closeModal;

  const tabVisual = document.getElementById('modal-tab-visual');
  const tabRaw = document.getElementById('modal-tab-raw');
  const viewVisual = document.getElementById('modal-rule-visual');
  const viewRaw = document.getElementById('modal-rule-raw');

  const typeEl = document.getElementById('modal-rule-type');
  const payloadEl = document.getElementById('modal-rule-payload');
  const targetEl = document.getElementById('modal-rule-target');
  const noResolveEl = document.getElementById('modal-rule-noresolve');
  const previewEl = document.getElementById('modal-rule-preview');
  const rawInput = document.getElementById('modal-rule-raw-input');

  const updatePreview = () => {
    const t = typeEl.value;
    const target = targetEl.value;
    const payload = payloadEl.value.trim();
    const nr = noResolveEl.checked;

    let res = '';
    if (t === 'MATCH') {
      res = `MATCH,${target}`;
    } else {
      res = `${t},${payload},${target}`;
      if (nr) res += ',no-resolve';
    }
    previewEl.textContent = res;
    rawInput.value = res;
  };

  typeEl.onchange = () => {
    const isMatch = typeEl.value === 'MATCH';
    const pwrap = document.getElementById('modal-rule-payload-wrap');
    if (pwrap) {
      if (isMatch) pwrap.classList.add('hidden');
      else pwrap.classList.remove('hidden');
    }
    updatePreview();
  };
  payloadEl.oninput = updatePreview;
  targetEl.onchange = updatePreview;
  noResolveEl.onchange = updatePreview;

  updatePreview();

  tabVisual.onclick = () => {
    isRawMode = false;
    tabVisual.className = 'flex-1 py-1 px-2 rounded font-medium transition-colors bg-zinc-800 text-zinc-100 shadow-sm';
    tabRaw.className = 'flex-1 py-1 px-2 rounded font-medium transition-colors text-zinc-400 hover:text-zinc-200';
    viewVisual.classList.remove('hidden');
    viewRaw.classList.add('hidden');
  };

  tabRaw.onclick = () => {
    isRawMode = true;
    tabRaw.className = 'flex-1 py-1 px-2 rounded font-medium transition-colors bg-zinc-800 text-zinc-100 shadow-sm';
    tabVisual.className = 'flex-1 py-1 px-2 rounded font-medium transition-colors text-zinc-400 hover:text-zinc-200';
    viewRaw.classList.remove('hidden');
    viewVisual.classList.add('hidden');
  };

  document.getElementById('modal-rule-save').onclick = async () => {
    let finalRuleStr = '';
    if (isRawMode) {
      finalRuleStr = rawInput.value.trim();
    } else {
      const t = typeEl.value;
      const target = targetEl.value;
      const payload = payloadEl.value.trim();
      const nr = noResolveEl.checked;
      if (t === 'MATCH') {
        finalRuleStr = `MATCH,${target}`;
      } else {
        if (!payload) {
          showToast('Payload is required for rule type ' + t, 'error');
          return;
        }
        finalRuleStr = `${t},${payload},${target}`;
        if (nr) finalRuleStr += ',no-resolve';
      }
    }

    if (!finalRuleStr) {
      showToast('Rule string cannot be empty', 'error');
      return;
    }

    const saveBtn = document.getElementById('modal-rule-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      if (isEdit) {
        await API.editRawRule(index, finalRuleStr);
        showToast(`Rule #${index + 1} updated`, 'success');
      } else {
        const posEl = document.getElementById('modal-rule-position');
        const insertIdx = posEl ? parseInt(posEl.value, 10) : -1;
        await API.addRawRule(finalRuleStr, insertIdx);
        showToast('Rule added to sequence', 'success');
      }
      closeModal();
      await fetchLocal();
      render();
    } catch (err) {
      showToast(err.message, 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save & Reload';
    }
  };
}
