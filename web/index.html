<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miru — Mihomo Rule Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
      },
      colors: {
        zinc: {
          950: '#09090b',
          900: '#18181b',
          800: '#27272a',
          700: '#3f3f46',
          600: '#52525b',
          500: '#71717a',
          400: '#a1a1aa',
          300: '#d4d4d8',
          200: '#e4e4e7',
          100: '#f4f4f5',
          50: '#fafafa',
        }
      }
    }
  }
}
</script>
<style>
  * { border-color: #27272a; }
  body { background-color: #09090b; color: #fafafa; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .toast-slide { animation: toastSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes toastSlide {
    from { transform: translateY(-8px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #09090b; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-zinc-800 selection:text-zinc-50">

<header class="w-full border-b border-zinc-800 bg-zinc-950/90 backdrop-blur sticky top-0 z-30">
  <div class="w-full px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3.5">
      <div class="w-7 h-7 rounded-md bg-zinc-100 text-zinc-950 flex items-center justify-center font-bold text-sm tracking-tighter shadow-sm">
        M
      </div>
      <div class="flex items-center gap-2.5">
        <span class="font-semibold text-sm tracking-tight text-zinc-100">Miru</span>
        <span class="text-[11px] font-mono bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800">Mihomo MRS Manager</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btn-custom-rule" class="h-8 px-3 text-xs font-medium border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Custom MRS
      </button>

      <button id="btn-reload-mihomo" class="h-8 px-3 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded-md transition-colors flex items-center gap-1.5 shadow-sm font-semibold">
        <svg id="reload-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reload Core
      </button>
    </div>
  </div>
</header>

<div class="w-full px-6 py-6 flex-1 space-y-6">

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full">
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-4">
      <div class="text-xs font-medium text-zinc-400">Active Directives</div>
      <div id="stat-active" class="text-2xl font-semibold tracking-tight text-zinc-100 mt-1">0</div>
      <p class="text-[11px] text-zinc-500 mt-1 font-mono">RULE-SET rules</p>
    </div>
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-4">
      <div class="text-xs font-medium text-zinc-400">Rule Providers</div>
      <div id="stat-providers" class="text-2xl font-semibold tracking-tight text-zinc-100 mt-1">0</div>
      <p class="text-[11px] text-zinc-500 mt-1 font-mono">Registered in AST</p>
    </div>
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-4">
      <div class="text-xs font-medium text-zinc-400">Disk Binaries</div>
      <div id="stat-files" class="text-2xl font-semibold tracking-tight text-zinc-100 mt-1">0</div>
      <p class="text-[11px] text-zinc-500 mt-1 font-mono">.mrs in rules folder</p>
    </div>
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/40 p-4">
      <div class="text-xs font-medium text-zinc-400">Mihomo Status</div>
      <div class="flex items-center gap-2 mt-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="text-base font-semibold tracking-tight text-zinc-100">Ready</span>
      </div>
      <p id="stat-config" class="text-[11px] text-zinc-500 mt-1 font-mono truncate">/etc/mihomo/config.yaml</p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 border-b border-zinc-800 pb-3">
    <div class="inline-flex h-9 items-center justify-center rounded-lg bg-zinc-900 p-1 text-zinc-400 border border-zinc-800" id="tabs">
      <button data-tab="catalog" class="tab-btn px-3 py-1 text-xs font-medium rounded-md transition-all bg-zinc-800 text-zinc-50 shadow-sm">Rules Catalog</button>
      <button data-tab="active" class="tab-btn px-3 py-1 text-xs font-medium rounded-md transition-all hover:text-zinc-100">Active Directives</button>
      <button data-tab="local" class="tab-btn px-3 py-1 text-xs font-medium rounded-md transition-all hover:text-zinc-100">Config & Files</button>
    </div>

    <div class="text-xs text-zinc-500 font-mono" id="catalog-status-text">
      Ready
    </div>
  </div>

  <main id="tab-content" class="w-full"></main>
</div>

<footer class="border-t border-zinc-800/80 py-4 px-6 text-xs text-zinc-500 flex items-center justify-between">
  <span>Miru · Embedded Linux / OpenWrt Mihomo Controller</span>
  <a href="https://github.com/paintingpromisesss/miru" target="_blank" rel="noopener" class="hover:text-zinc-300 transition-colors">GitHub Repository</a>
</footer>

<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
<div id="modal-container" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4"></div>

<script>
const API = {
  getLocal: () => fetch('/api/local').then(r => r.json()),
  getCatalog: (refresh = false) => fetch('/api/catalog' + (refresh ? '?action=refresh' : '')).then(r => r.json()),
  addRule: (data) => fetch('/api/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }),
  deleteRule: (name, deleteFile = true) => fetch(`/api/rules?name=${encodeURIComponent(name)}&delete_file=${deleteFile}`, {
    method: 'DELETE'
  }),
  reloadMihomo: () => fetch('/api/reload', { method: 'POST' }).then(r => r.json())
};

let state = {
  currentTab: 'catalog',
  local: null,
  catalog: [],
  catalogLoading: false,
  catalogLoadedAt: '',
  catalogWarning: '',
  searchQuery: '',
  categoryFilter: 'all',
};

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const border = {
    success: 'border-emerald-800/60 bg-zinc-900 text-zinc-200',
    error: 'border-red-800/60 bg-zinc-900 text-zinc-200',
    info: 'border-zinc-800 bg-zinc-900 text-zinc-200',
    warning: 'border-amber-800/60 bg-zinc-900 text-zinc-200',
  }[type] || 'border-zinc-800 bg-zinc-900 text-zinc-200';

  const dot = {
    success: 'bg-emerald-500',
    error: 'bg-red-500',
    info: 'bg-zinc-400',
    warning: 'bg-amber-500',
  }[type] || 'bg-zinc-400';

  toast.className = `toast-slide border rounded-md p-3 text-xs shadow-lg flex items-center gap-2.5 pointer-events-auto ${border}`;
  toast.innerHTML = `
    <span class="w-2 h-2 rounded-full ${dot} flex-shrink-0"></span>
    <div class="flex-1">${escapeHtml(message)}</div>
    <button class="text-zinc-500 hover:text-zinc-300 text-sm leading-none">&times;</button>
  `;
  toast.querySelector('button').onclick = () => toast.remove();
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3500);
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function setTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `tab-btn px-3 py-1 text-xs font-medium rounded-md transition-all ${
      active ? 'bg-zinc-800 text-zinc-50 shadow-sm' : 'text-zinc-400 hover:text-zinc-100'
    }`;
  });
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

async function fetchLocal() {
  try {
    const data = await API.getLocal();
    state.local = data;
    updateStats();
  } catch (err) {
    showToast('Failed to load local config: ' + err.message, 'error');
  }
}

async function fetchCatalog(refresh = false) {
  state.catalogLoading = true;
  document.getElementById('catalog-status-text').textContent = 'Fetching rulesets...';
  if (state.currentTab === 'catalog') render();
  try {
    const res = await API.getCatalog(refresh);
    state.catalog = res.items || [];
    state.catalogLoadedAt = res.loaded_at || '';
    state.catalogWarning = res.warning || '';
    document.getElementById('catalog-status-text').textContent = `${state.catalog.length} rulesets available`;
  } catch (err) {
    document.getElementById('catalog-status-text').textContent = 'Catalog sync failed';
    showToast('Catalog load error: ' + err.message, 'error');
  } finally {
    state.catalogLoading = false;
    render();
  }
}

function updateStats() {
  if (!state.local) return;
  const activeCount = (state.local.rules || []).filter(r => r.trim().startsWith('RULE-SET,')).length;
  const provCount = (state.local.rule_providers || []).length;
  const fileCount = (state.local.disk_files || []).length;
  document.getElementById('stat-active').textContent = activeCount;
  document.getElementById('stat-providers').textContent = provCount;
  document.getElementById('stat-files').textContent = fileCount;
  if (state.local.config_path) {
    document.getElementById('stat-config').textContent = state.local.config_path;
  }
}

function render() {
  const content = document.getElementById('tab-content');
  if (state.currentTab === 'catalog') {
    content.innerHTML = renderCatalogView();
    bindCatalogEvents();
  } else if (state.currentTab === 'active') {
    content.innerHTML = renderActiveRulesView();
    bindActiveEvents();
  } else if (state.currentTab === 'local') {
    content.innerHTML = renderLocalView();
  }
}

function renderCatalogView() {
  const q = state.searchQuery.toLowerCase();
  const filter = state.categoryFilter;

  const filtered = state.catalog.filter(item => {
    if (filter === 'geosite' && item.category !== 'geosite') return false;
    if (filter === 'geoip' && item.category !== 'geoip') return false;
    if (filter === 'applied' && !item.applied) return false;
    if (q && !item.name.toLowerCase().includes(q) && !item.path.toLowerCase().includes(q)) return false;
    return true;
  });

  return `
    <div class="space-y-4 w-full">
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between w-full">
        <div class="relative flex-1">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="cat-search" type="text" value="${escapeHtml(state.searchQuery)}" placeholder="Filter rules by name or path (e.g. youtube, telegram, cn)..." class="h-9 w-full pl-9 pr-3 bg-zinc-900 border border-zinc-800 rounded-md text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-400 transition-all">
        </div>

        <div class="flex items-center gap-1.5 flex-wrap">
          <button data-cat-filter="all" class="h-8 px-2.5 text-xs font-medium rounded-md border transition-colors ${filter === 'all' ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">All (${state.catalog.length})</button>
          <button data-cat-filter="geosite" class="h-8 px-2.5 text-xs font-medium rounded-md border transition-colors ${filter === 'geosite' ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">Geosite</button>
          <button data-cat-filter="geoip" class="h-8 px-2.5 text-xs font-medium rounded-md border transition-colors ${filter === 'geoip' ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">GeoIP</button>
          <button data-cat-filter="applied" class="h-8 px-2.5 text-xs font-medium rounded-md border transition-colors ${filter === 'applied' ? 'bg-zinc-800 border-zinc-700 text-zinc-100' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">Active Only</button>

          <button id="cat-refresh-btn" title="Refresh catalog" class="h-8 w-8 flex items-center justify-center rounded-md border border-zinc-800 bg-zinc-900 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition-colors">
            <svg class="w-3.5 h-3.5 ${state.catalogLoading ? 'spin' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>
      </div>

      <div class="rounded-md border border-zinc-800 bg-zinc-900/30 overflow-hidden w-full">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-zinc-900/80 text-[11px] font-medium text-zinc-400">
              <th class="py-2.5 px-4">Ruleset Name</th>
              <th class="py-2.5 px-4">Category</th>
              <th class="py-2.5 px-4">Behavior</th>
              <th class="py-2.5 px-4">Size</th>
              <th class="py-2.5 px-4">Status</th>
              <th class="py-2.5 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-zinc-800/60 text-xs">
            ${state.catalogLoading && filtered.length === 0 ? `
              <tr>
                <td colspan="6" class="py-12 text-center text-zinc-500 font-mono">
                  <div class="w-5 h-5 border-2 border-zinc-400 border-t-transparent rounded-full spin mx-auto mb-2"></div>
                  Synchronizing catalog tree...
                </td>
              </tr>
            ` : filtered.length === 0 ? `
              <tr>
                <td colspan="6" class="py-12 text-center text-zinc-500">
                  No matching rulesets found in catalog.
                </td>
              </tr>
            ` : filtered.map(item => `
              <tr class="hover:bg-zinc-900/50 transition-colors ${item.applied ? 'bg-zinc-900/20' : ''}">
                <td class="py-2.5 px-4 font-mono">
                  <div class="font-semibold text-zinc-200">${escapeHtml(item.name)}</div>
                  <div class="text-[11px] text-zinc-500 font-mono truncate max-w-sm">${escapeHtml(item.path)}</div>
                </td>
                <td class="py-2.5 px-4">
                  <span class="inline-flex items-center text-[10px] font-mono px-2 py-0.5 rounded border ${
                    item.category === 'geosite'
                      ? 'bg-sky-500/10 text-sky-400 border-sky-500/20'
                      : 'bg-purple-500/10 text-purple-400 border-purple-500/20'
                  }">${escapeHtml(item.category)}</span>
                </td>
                <td class="py-2.5 px-4 font-mono text-zinc-400">${escapeHtml(item.behavior)}</td>
                <td class="py-2.5 px-4 font-mono text-zinc-400">${formatBytes(item.size)}</td>
                <td class="py-2.5 px-4">
                  ${item.applied ? `
                    <span class="inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-400">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active
                    </span>
                  ` : `
                    <span class="text-zinc-500 text-[11px]">Available</span>
                  `}
                </td>
                <td class="py-2.5 px-4 text-right">
                  ${item.applied ? `
                    <button data-remove="${escapeHtml(item.name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
                      Remove
                    </button>
                  ` : `
                    <button data-add-item='${JSON.stringify(item)}' class="h-7 px-2.5 text-xs font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-950 rounded transition-colors shadow-sm font-semibold">
                      Add Rule
                    </button>
                  `}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="text-[11px] text-zinc-500 font-mono px-1">
        Showing ${filtered.length} of ${state.catalog.length} total rulesets
      </div>
    </div>
  `;
}

function bindCatalogEvents() {
  const searchInput = document.getElementById('cat-search');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      render();
      const el = document.getElementById('cat-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }

  document.querySelectorAll('[data-cat-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.categoryFilter = btn.dataset.catFilter;
      render();
    });
  });

  const refBtn = document.getElementById('cat-refresh-btn');
  if (refBtn) {
    refBtn.addEventListener('click', () => fetchCatalog(true));
  }

  document.querySelectorAll('[data-add-item]').forEach(btn => {
    btn.addEventListener('click', () => {
      openAddRuleModal(JSON.parse(btn.dataset.addItem));
    });
  });

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      confirmDeleteRule(btn.dataset.remove);
    });
  });
}

function renderActiveRulesView() {
  if (!state.local) return '<div class="text-center py-12 text-zinc-500 font-mono">Loading config...</div>';

  const rules = (state.local.rules || []).filter(r => r.trim().startsWith('RULE-SET,'));
  const providersMap = {};
  (state.local.rule_providers || []).forEach(p => { providersMap[p.name] = p; });

  const diskMap = {};
  (state.local.disk_files || []).forEach(f => { diskMap[f.name.toLowerCase()] = f; });

  return `
    <div class="space-y-4 w-full">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-zinc-100">Registered Rule Directives</h2>
          <p class="text-xs text-zinc-500">Mihomo traffic matching these sets is forwarded to target proxy groups</p>
        </div>
        <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2.5 py-1 rounded border border-zinc-800">${rules.length} active directives</span>
      </div>

      <div class="rounded-md border border-zinc-800 bg-zinc-900/30 overflow-hidden w-full">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-zinc-900/80 text-[11px] font-medium text-zinc-400">
              <th class="py-2.5 px-4 w-12">#</th>
              <th class="py-2.5 px-4">Provider / Ruleset</th>
              <th class="py-2.5 px-4">Target Group</th>
              <th class="py-2.5 px-4">Behavior</th>
              <th class="py-2.5 px-4">Local Binary (.mrs)</th>
              <th class="py-2.5 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-zinc-800/60 text-xs">
            ${rules.length === 0 ? `
              <tr>
                <td colspan="6" class="py-12 text-center text-zinc-500">
                  No active RULE-SET directives in config. Add rules from the Catalog tab or via Custom MRS.
                </td>
              </tr>
            ` : rules.map((rule, idx) => {
              const parts = rule.split(',').map(s => s.trim());
              const name = parts[1] || '';
              const targetGroup = parts[2] || '';
              const prov = providersMap[name];
              const fileName = (name + '.mrs').toLowerCase();
              const diskFile = diskMap[fileName];

              return `
                <tr class="hover:bg-zinc-900/50 transition-colors">
                  <td class="py-2.5 px-4 font-mono text-zinc-500">${idx + 1}</td>
                  <td class="py-2.5 px-4 font-mono">
                    <span class="font-semibold text-zinc-100">${escapeHtml(name)}</span>
                    ${prov && prov.url ? `<div class="text-[11px] text-zinc-500 truncate max-w-sm">${escapeHtml(prov.url)}</div>` : ''}
                  </td>
                  <td class="py-2.5 px-4">
                    <span class="inline-flex items-center text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-800 text-zinc-200 border border-zinc-700 font-semibold">
                      ${escapeHtml(targetGroup)}
                    </span>
                  </td>
                  <td class="py-2.5 px-4 font-mono text-zinc-400">
                    ${prov ? escapeHtml(prov.behavior) : 'domain'}
                  </td>
                  <td class="py-2.5 px-4">
                    ${diskFile ? `
                      <span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-mono">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Downloaded (${formatBytes(diskFile.size)})
                      </span>
                    ` : `
                      <span class="inline-flex items-center gap-1.5 text-[11px] text-amber-400 font-mono">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                        Pending Core Download
                      </span>
                    `}
                  </td>
                  <td class="py-2.5 px-4 text-right">
                    <button data-delete-rule="${escapeHtml(name)}" class="h-7 px-2.5 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded border border-red-500/20 transition-colors">
                      Delete
                    </button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function bindActiveEvents() {
  document.querySelectorAll('[data-delete-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      confirmDeleteRule(btn.dataset.deleteRule);
    });
  });
}

function renderLocalView() {
  if (!state.local) return '<div class="text-center py-12 text-zinc-500 font-mono">Loading config...</div>';

  const s = state.local;

  return `
    <div class="space-y-6 w-full">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
        <div class="rounded-lg border border-zinc-800 bg-zinc-900/30 p-5 space-y-3">
          <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Available Proxy Groups</h3>
          <p class="text-xs text-zinc-500">Discovered from proxy-groups section in Mihomo config.yaml</p>
          <div class="flex flex-wrap gap-1.5 pt-1">
            ${(s.proxy_groups || []).map(g => `
              <span class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 rounded text-xs font-mono text-zinc-300">${escapeHtml(g)}</span>
            `).join('')}
          </div>
        </div>

        <div class="rounded-lg border border-zinc-800 bg-zinc-900/30 p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Files in Rules Folder</h3>
            <span class="text-xs font-mono text-zinc-500">${(s.disk_files || []).length} files</span>
          </div>
          <p class="text-xs text-zinc-500 font-mono truncate">${escapeHtml(s.rules_dir)}</p>
          <div class="max-h-48 overflow-y-auto divide-y divide-zinc-800/60 font-mono text-xs border border-zinc-800 rounded bg-zinc-950/50">
            ${(s.disk_files || []).length === 0 ? `
              <div class="p-3 text-zinc-500 text-center italic">No rules downloaded yet.</div>
            ` : s.disk_files.map(f => `
              <div class="px-3 py-2 flex items-center justify-between">
                <span class="text-zinc-200">${escapeHtml(f.name)}</span>
                <span class="text-zinc-500">${formatBytes(f.size)} · ${escapeHtml(f.mod_time)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="rounded-lg border border-zinc-800 bg-zinc-900/30 p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Mihomo Rules Evaluation Sequence</h3>
          <span class="text-xs font-mono text-zinc-500">${(s.rules || []).length} total lines</span>
        </div>
        <div class="border border-zinc-800 rounded bg-zinc-950 font-mono text-xs max-h-72 overflow-y-auto divide-y divide-zinc-800/50">
          ${(s.rules || []).map((r, i) => `
            <div class="px-3 py-1.5 flex items-center gap-3 ${r.includes('MATCH') ? 'bg-amber-500/10 text-amber-300 font-semibold' : 'text-zinc-300'}">
              <span class="text-zinc-600 select-none w-8 text-right font-mono">${i+1}</span>
              <span class="truncate">${escapeHtml(r)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function openAddRuleModal(preset = null) {
  if (!state.local || (state.local.proxy_groups || []).length === 0) {
    showToast('No proxy groups detected in Mihomo config.yaml', 'error');
    return;
  }

  const groups = state.local.proxy_groups || ['DIRECT', 'REJECT'];
  const defaultGroup = groups.includes('UNBLOCK') ? 'UNBLOCK' :
                       groups.includes('PROXY') ? 'PROXY' :
                       groups.includes('STABLE') ? 'STABLE' : groups[0];

  const modal = document.getElementById('modal-container');
  const isCustom = !preset;
  const initialName = preset ? (preset.category === 'geoip' ? 'geoip-' + preset.name : preset.name) : '';
  const initialUrl = preset ? preset.url : '';
  const initialBehavior = preset ? preset.behavior : 'domain';

  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-lg w-full space-y-5 shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="font-semibold text-sm text-zinc-100">${isCustom ? 'Register Custom Ruleset' : 'Add Ruleset to Mihomo'}</h3>
          <p class="text-xs text-zinc-500 mt-0.5">Configuration will be persisted and reloaded instantly</p>
        </div>
        <button id="modal-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">&times;</button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Provider Name (Rule-Set ID)</label>
          <input id="modal-name" type="text" value="${escapeHtml(initialName)}" placeholder="e.g. youtube or my-domains" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Download URL (.mrs file)</label>
          <input id="modal-url" type="text" value="${escapeHtml(initialUrl)}" placeholder="https://..." class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-mono focus:border-zinc-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-300 mb-1 font-medium">Behavior</label>
            <select id="modal-behavior" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 focus:border-zinc-500 focus:outline-none">
              <option value="domain" ${initialBehavior === 'domain' ? 'selected' : ''}>domain (geosite)</option>
              <option value="ipcidr" ${initialBehavior === 'ipcidr' ? 'selected' : ''}>ipcidr (geoip)</option>
              <option value="classical" ${initialBehavior === 'classical' ? 'selected' : ''}>classical</option>
            </select>
          </div>

          <div>
            <label class="block text-zinc-300 mb-1 font-medium">Format</label>
            <select id="modal-format" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 focus:border-zinc-500 focus:outline-none">
              <option value="mrs" selected>mrs (binary)</option>
              <option value="yaml">yaml</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-zinc-300 mb-1 font-medium">Target Proxy Group</label>
          <select id="modal-group" class="h-9 w-full px-3 bg-zinc-900 border border-zinc-800 rounded-md text-zinc-100 font-medium focus:border-zinc-500 focus:outline-none">
            ${groups.map(g => `<option value="${escapeHtml(g)}" ${g === defaultGroup ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-zinc-800">
        <button id="modal-cancel-btn" class="h-8 px-3 rounded-md text-xs font-medium text-zinc-300 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition-colors">Cancel</button>
        <button id="modal-submit-btn" class="h-8 px-3 rounded-md text-xs font-semibold bg-zinc-100 hover:bg-zinc-200 text-zinc-950 transition-colors">Apply & Reload</button>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel-btn').onclick = closeModal;
  modal.onclick = closeModal;

  document.getElementById('modal-submit-btn').onclick = async () => {
    const name = document.getElementById('modal-name').value.trim();
    const url = document.getElementById('modal-url').value.trim();
    const behavior = document.getElementById('modal-behavior').value;
    const format = document.getElementById('modal-format').value;
    const proxyGroup = document.getElementById('modal-group').value;

    if (!name || !url || !proxyGroup) {
      showToast('Please fill all fields', 'error');
      return;
    }

    const submitBtn = document.getElementById('modal-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    try {
      const res = await API.addRule({
        name: name,
        url: url,
        behavior: behavior,
        format: format,
        proxy_group: proxyGroup
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      showToast(`Rule ${name} added and reloaded`, 'success');
      closeModal();
      await fetchLocal();
      await fetchCatalog(false);
    } catch (err) {
      showToast(err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Apply & Reload';
    }
  };

  document.getElementById('modal-name').focus();
}

function confirmDeleteRule(name) {
  const modal = document.getElementById('modal-container');
  modal.innerHTML = `
    <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-sm w-full space-y-4 shadow-2xl relative" onclick="event.stopPropagation()">
      <div>
        <h3 class="font-semibold text-sm text-zinc-100">Remove Ruleset</h3>
        <p class="text-xs text-zinc-400 font-mono mt-1">${escapeHtml(name)}</p>
      </div>

      <p class="text-xs text-zinc-400">
        Removes the <code>RULE-SET</code> entry from rules and unregisters the provider from <code>config.yaml</code>.
      </p>

      <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer bg-zinc-900 p-2.5 rounded-md border border-zinc-800">
        <input id="modal-del-file" type="checkbox" checked class="rounded bg-zinc-950 border-zinc-700">
        <span>Also delete downloaded <code>.mrs</code> file</span>
      </label>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
        <button id="modal-del-cancel" class="h-8 px-3 rounded-md text-xs font-medium text-zinc-300 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition-colors">Cancel</button>
        <button id="modal-del-confirm" class="h-8 px-3 rounded-md text-xs font-medium text-red-400 bg-red-500/10 border border-red-500/20 hover:bg-red-500/20 transition-colors">Delete</button>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
  modal.classList.add('flex');

  const closeModal = () => {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
  };

  document.getElementById('modal-del-cancel').onclick = closeModal;
  modal.onclick = closeModal;

  document.getElementById('modal-del-confirm').onclick = async () => {
    const deleteFile = document.getElementById('modal-del-file').checked;
    const btn = document.getElementById('modal-del-confirm');
    btn.disabled = true;
    btn.textContent = 'Removing...';

    try {
      const res = await API.deleteRule(name, deleteFile);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      showToast(`Removed ${name}`, 'success');
      closeModal();
      await fetchLocal();
      await fetchCatalog(false);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  };
}

document.getElementById('btn-custom-rule').addEventListener('click', () => {
  openAddRuleModal(null);
});

document.getElementById('btn-reload-mihomo').addEventListener('click', async () => {
  const icon = document.getElementById('reload-icon');
  icon.classList.add('spin');
  try {
    const data = await API.reloadMihomo();
    if (data.status === 'ok') {
      showToast('Mihomo hot-reloaded successfully', 'success');
    } else {
      showToast(data.error || 'Hot-reload failed', 'error');
    }
  } catch (err) {
    showToast('Failed to reach Mihomo API: ' + err.message, 'error');
  } finally {
    icon.classList.remove('spin');
  }
});

async function init() {
  await fetchLocal();
  await fetchCatalog(false);
  setTab('catalog');
}

init();
</script>
</body>
</html>
